<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Turbo Screener Pro</title>
    <style>
        :root {
            --bg: #0b0e11; --card: #181a20; --border: #2b3139;
            --text: #eaecef; --dim: #848e9c; --green: #0ecb81;
            --red: #f6465d; --accent: #fcd535; --orange: #f0b90b;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 10px; }
        
        .controls-row { max-width: 100%; margin-bottom: 10px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
        
        .search-box { flex: 1; min-width: 200px; position: relative; }
        .search-box input { 
            width: 100%; background: var(--card); border: 1px solid var(--border); 
            padding: 10px 15px; border-radius: 4px; color: #fff; outline: none; font-size: 14px;
        }
        .search-box input:focus { border-color: var(--accent); }

        .scanner-info { flex: 2; min-width: 300px; padding: 8px 15px; background: #1e2026; border: 1px solid var(--border); border-radius: 8px; }
        .progress-box { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; color: var(--dim); }
        .progress-bar { height: 4px; background: #2b3139; border-radius: 2px; }
        #progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.1s; }

        .tabs-container { margin-bottom: 15px; display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; align-items: center; }
        .tab { padding: 8px 20px; font-size: 12px; cursor: pointer; border-radius: 4px; color: var(--dim); background: var(--card); border: 1px solid var(--border); white-space: nowrap; transition: 0.2s; }
        .tab.active { color: #000; background: var(--accent); border-color: var(--accent); font-weight: bold; }

        .main-grid { display: flex; flex-direction: row; gap: 15px; width: 100%; align-items: flex-start; }
        .table-section { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; min-width: 0; }
        .table-header { padding: 12px 15px; background: #1e2026; border-bottom: 1px solid var(--border); font-weight: bold; font-size: 14px; }
        
        .table-wrapper { width: 100%; overflow-x: auto; max-height: 75vh; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { text-align: right; padding: 10px 12px; color: var(--dim); font-size: 10px; text-transform: uppercase; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: #1e2026; z-index: 5; }
        
        th:nth-child(1), td:nth-child(1) { text-align: left; width: 25px; padding-left: 15px; }
        th:nth-child(2), td:nth-child(2) { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 10; font-weight: bold; border-right: 1px solid var(--border); }
        th:nth-child(2) { background: #1e2026; }

        td { padding: 10px 12px; text-align: right; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; font-size: 12px; }
        .symbol-name { color: #fff; }
        .green { color: var(--green); }
        .red { color: var(--red); }
        .vol-orange { color: var(--orange); font-weight: 500; }
        .active-rank-bg { background: rgba(252, 213, 53, 0.05); }

        @media (max-width: 1100px) { .main-grid { flex-direction: column; } }
    </style>
</head>
<body>

<div class="controls-row">
    <div class="search-box">
        <input type="text" id="cryptoSearch" placeholder="Search (e.g. BTC or btc)..." oninput="renderTables()">
    </div>
    <div class="scanner-info">
        <div class="progress-box">
            <span id="scan-status">Worker Pool: 20 Threads</span>
            <span id="scan-pct">0%</span>
        </div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
    </div>
</div>

<div class="tabs-container">
    <span style="font-size: 11px; color: var(--dim); margin-right: 5px;">RANK BY:</span>
    <div class="tab" id="tab-5m" onclick="setRank('5m', this)">5M</div>
    <div class="tab" id="tab-15m" onclick="setRank('15m', this)">15M</div>
    <div class="tab" id="tab-1h" onclick="setRank('1h', this)">1H</div>
    <div class="tab active" id="tab-24h" onclick="setRank('24h', this)">24H</div>
</div>

<div class="main-grid">
    <div class="table-section">
        <div class="table-header" style="color: var(--green);">Gainers (Top 50)</div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>#</th><th>Symbol</th><th>Price</th><th>5M</th><th>15M</th><th>1H</th><th>24H</th><th>Volume</th></tr></thead>
                <tbody id="gainers-body"></tbody>
            </table>
        </div>
    </div>
    <div class="table-section">
        <div class="table-header" style="color: var(--red);">Losers (Top 50)</div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>#</th><th>Symbol</th><th>Price</th><th>5M</th><th>15M</th><th>1H</th><th>24H</th><th>Volume</th></tr></thead>
                <tbody id="losers-body"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API = "https://fapi.binance.com/fapi/v1";
    let pairsData = JSON.parse(localStorage.getItem('ultra_v4_cache')) || [];
    let rankBy = localStorage.getItem('ultra_v4_rank') || '24h';
    const CONCURRENCY = 20;

    // Apply saved rank on load
    document.querySelectorAll('.tab').forEach(t => {
        t.classList.remove('active');
        if(t.id === `tab-${rankBy}`) t.classList.add('active');
    });

    async function fetchCoin(ticker) {
        try {
            const [m5, m15, h1] = await Promise.all([
                fetch(`${API}/klines?symbol=${ticker.symbol}&interval=5m&limit=2`).then(r => r.json()),
                fetch(`${API}/klines?symbol=${ticker.symbol}&interval=15m&limit=2`).then(r => r.json()),
                fetch(`${API}/klines?symbol=${ticker.symbol}&interval=1h&limit=2`).then(r => r.json())
            ]);
            const calc = (d) => (((parseFloat(d[d.length-1][4]) - parseFloat(d[0][1])) / parseFloat(d[0][1])) * 100).toFixed(2);
            
            const coin = {
                symbol: ticker.symbol.replace('USDT', ''),
                price: parseFloat(ticker.lastPrice),
                '5m': parseFloat(calc(m5)),
                '15m': parseFloat(calc(m15)),
                '1h': parseFloat(calc(h1)),
                '24h': parseFloat(ticker.priceChangePercent),
                'vol': parseFloat(ticker.quoteVolume)
            };

            const idx = pairsData.findIndex(p => p.symbol === coin.symbol);
            if (idx > -1) pairsData[idx] = coin; else pairsData.push(coin);
        } catch (e) {}
    }

    async function turboScan() {
        try {
            const res = await fetch(`${API}/ticker/24hr`);
            const tickers = (await res.json()).filter(t => t.symbol.endsWith('USDT'));
            let i = 0;
            const worker = async () => {
                while (i < tickers.length) {
                    const currentTicker = tickers[i++];
                    await fetchCoin(currentTicker);
                    const pct = Math.round((i / tickers.length) * 100);
                    document.getElementById('progress-fill').style.width = pct + "%";
                    document.getElementById('scan-pct').innerText = pct + "%";
                    if (i % 8 === 0) renderTables();
                }
            };
            await Promise.all(Array(CONCURRENCY).fill(null).map(worker));
            localStorage.setItem('ultra_v4_cache', JSON.stringify(pairsData));
            setTimeout(turboScan, 5000);
        } catch (e) { setTimeout(turboScan, 3000); }
    }

    function setRank(key, el) {
        rankBy = key;
        localStorage.setItem('ultra_v4_rank', key);
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        renderTables();
    }

    function formatVol(val) {
        if (val >= 1e9) return (val / 1e9).toFixed(2) + 'B';
        if (val >= 1e6) return (val / 1e6).toFixed(2) + 'M';
        return Math.round(val).toLocaleString();
    }

    function renderTables() {
        // Case-Insensitive Search: Convert both to Uppercase
        const query = document.getElementById('cryptoSearch').value.trim().toUpperCase();
        const filtered = query ? pairsData.filter(p => p.symbol.toUpperCase().includes(query)) : pairsData;

        const sorted = [...filtered].sort((a, b) => b[rankBy] - a[rankBy]);
        const gainers = sorted.slice(0, 50);
        const losers = [...sorted].reverse().slice(0, 50);

        const build = (data) => data.map((c, i) => `
            <tr>
                <td>${i + 1}</td>
                <td><span class="symbol-name">${c.symbol}</span></td>
                <td>$${c.price < 1 ? c.price.toFixed(5) : c.price.toLocaleString()}</td>
                <td class="${c['5m']>=0?'green':'red'} ${rankBy==='5m'?'active-rank-bg':''}">${c['5m']}%</td>
                <td class="${c['15m']>=0?'green':'red'} ${rankBy==='15m'?'active-rank-bg':''}">${c['15m']}%</td>
                <td class="${c['1h']>=0?'green':'red'} ${rankBy==='1h'?'active-rank-bg':''}">${c['1h']}%</td>
                <td class="${c['24h']>=0?'green':'red'} ${rankBy==='24h'?'active-rank-bg':''}">${c['24h'].toFixed(2)}%</td>
                <td class="vol-orange">${formatVol(c['vol'])}</td>
            </tr>`).join('');

        document.getElementById('gainers-body').innerHTML = build(gainers);
        document.getElementById('losers-body').innerHTML = build(losers);
    }

    turboScan();
</script>
</body>
</html>
