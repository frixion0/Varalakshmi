<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuantPulse | Gainers & Losers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg-deep: #0c0e12;
            --bg-card: #161a1e;
            --border: #2b3139;
            --text-muted: #848e9c;
            --up: #02c076;
            --down: #f84960;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-deep); 
            color: #eaecef;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        .tf-nav {
            display: flex;
            background-color: var(--bg-card);
            padding: 4px;
            border-radius: 8px;
            gap: 4px;
            overflow-x: auto;
        }

        .tf-btn {
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            border-radius: 6px;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tf-btn.active { background-color: #2b3139; color: white; }

        .market-table { width: 100%; border-collapse: collapse; }
        .market-table th {
            text-align: right;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 600;
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            text-transform: uppercase;
            white-space: nowrap;
        }
        .market-table th:nth-child(1), .market-table th:nth-child(2) { text-align: left; }
        .market-table td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-variant-numeric: tabular-nums;
        }

        .row-breakout { background: linear-gradient(90deg, rgba(2, 192, 118, 0.04) 0%, transparent 100%); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        @media (max-width: 1024px) {
            .dual-panel { flex-direction: column; }
        }
    </style>
</head>
<body class="pb-10">

    <div class="max-w-[1440px] mx-auto px-4 py-6">
        <header class="mb-6 flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div>
                <h1 class="text-xl font-bold text-white tracking-tight">Market Pulse</h1>
                <p class="text-[10px] text-gray-500 font-bold uppercase tracking-widest mt-1">Binance Futures • Unlimited Scan</p>
            </div>
            
            <div class="flex items-center gap-4 bg-[#161a1e] px-4 py-2 rounded-lg border border-[#2b3139]">
                <span class="text-[10px] font-bold text-gray-500 uppercase tracking-widest">Only Breakouts</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="breakout-toggle" class="sr-only peer" onchange="runScreener()">
                    <div class="w-8 h-4 bg-gray-700 rounded-full peer peer-checked:bg-emerald-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:after:translate-x-4"></div>
                </label>
            </div>
        </header>

        <div class="tf-nav no-scrollbar mb-6 max-w-2xl">
            <button onclick="updateTF('5m')" id="btn-5m" class="tf-btn">5 minute</button>
            <button onclick="updateTF('15m')" id="btn-15m" class="tf-btn active">15 minute</button>
            <button onclick="updateTF('1h')" id="btn-1h" class="tf-btn">1 hour</button>
            <button onclick="updateTF('4h')" id="btn-4h" class="tf-btn">4 hour</button>
            <button onclick="updateTF('1d')" id="btn-1d" class="tf-btn">24 hour</button>
        </div>

        <div class="dual-panel flex gap-6">
            <div class="flex-1 bg-[#161a1e] rounded-xl border border-[#2b3139] overflow-hidden shadow-2xl">
                <div class="p-4 border-bottom border-[#2b3139] bg-emerald-500/5">
                    <h2 class="text-sm font-bold text-emerald-400 uppercase tracking-widest flex items-center gap-2">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full"></span> Top Gainers
                    </h2>
                </div>
                <div class="overflow-x-auto no-scrollbar">
                    <table class="market-table">
                        <thead>
                            <tr>
                                <th class="w-8">#</th>
                                <th>Symbol</th>
                                <th>Price</th>
                                <th class="pct-header">Change</th>
                                <th>24H Vol</th>
                            </tr>
                        </thead>
                        <tbody id="gainers-list"></tbody>
                    </table>
                </div>
            </div>

            <div class="flex-1 bg-[#161a1e] rounded-xl border border-[#2b3139] overflow-hidden shadow-2xl">
                <div class="p-4 border-bottom border-[#2b3139] bg-red-500/5">
                    <h2 class="text-sm font-bold text-red-400 uppercase tracking-widest flex items-center gap-2">
                        <span class="w-2 h-2 bg-red-500 rounded-full"></span> Top Losers
                    </h2>
                </div>
                <div class="overflow-x-auto no-scrollbar">
                    <table class="market-table">
                        <thead>
                            <tr>
                                <th class="w-8">#</th>
                                <th>Symbol</th>
                                <th>Price</th>
                                <th class="pct-header">Change</th>
                                <th>24H Vol</th>
                            </tr>
                        </thead>
                        <tbody id="losers-list"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="mt-6 flex justify-between items-center px-2">
            <div class="flex items-center gap-2 text-[10px] text-gray-500 font-bold uppercase tracking-widest">
                <span id="sync-time">Syncing...</span>
            </div>
            <span class="text-[10px] text-gray-600 font-bold uppercase tracking-tighter">Full Market Depth • Zero Filter</span>
        </div>
    </div>

    <script>
        const API_BASE = "https://fapi.binance.com/fapi/v1";
        let activeTF = '15m';

        async function updateTF(tf) {
            activeTF = tf;
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${tf}`).classList.add('active');
            document.querySelectorAll('.pct-header').forEach(h => h.innerText = `Change (${tf})`);
            runScreener();
        }

        function formatVol(v) {
            if (v >= 1e9) return '$' + (v/1e9).toFixed(2) + 'B';
            if (v >= 1e6) return '$' + (v/1e6).toFixed(1) + 'M';
            return '$' + (v/1e3).toFixed(0) + 'K';
        }

        async function fetchSymbolData(symbol, tf) {
            try {
                const [kReq, tReq] = await Promise.all([
                    fetch(`${API_BASE}/klines?symbol=${symbol}&interval=${tf}&limit=11`),
                    fetch(`${API_BASE}/ticker/24hr?symbol=${symbol}`)
                ]);
                const k = await kReq.json();
                const t = await tReq.json();
                const prev = k.slice(0, 10);
                const current = k[10];
                const high = Math.max(...prev.map(c => parseFloat(c[2])));
                const price = parseFloat(current[4]);
                const open = parseFloat(current[1]);
                
                return { s: symbol.replace('USDT',''), p: price, pct: ((price - open) / open) * 100, v24: parseFloat(t.quoteVolume), isBrk: price > high };
            } catch (e) { return null; }
        }

        async function runScreener() {
            const showOnlyBrk = document.getElementById('breakout-toggle').checked;
            try {
                const res = await fetch(`${API_BASE}/ticker/24hr`);
                const all = await res.json();
                
                // Unlimited logic: Pulling top 60 symbols to find best gainers and losers
                let targets = all.filter(t => t.symbol.endsWith('USDT'))
                                 .sort((a,b) => Math.abs(parseFloat(b.priceChangePercent)) - Math.abs(parseFloat(a.priceChangePercent)))
                                 .slice(0, 60).map(t => t.symbol);

                let data = await Promise.all(targets.map(s => fetchSymbolData(s, activeTF)));
                data = data.filter(d => d !== null);

                // Sort for Gainers (Highest Positive) and Losers (Highest Negative)
                let gainers = [...data].sort((a,b) => b.pct - a.pct);
                let losers = [...data].sort((a,b) => a.pct - b.pct);

                if (showOnlyBrk) {
                    gainers = gainers.filter(d => d.isBrk);
                    losers = losers.filter(d => d.isBrk);
                }

                renderTable('gainers-list', gainers.slice(0, 15));
                renderTable('losers-list', losers.slice(0, 15));
                
                document.getElementById('sync-time').innerText = `Last updated: ${new Date().toLocaleTimeString()}`;
            } catch (e) { console.error(e); }
        }

        function renderTable(id, data) {
            const list = document.getElementById(id);
            list.innerHTML = data.map((coin, index) => `
                <tr class="${coin.isBrk ? 'row-breakout' : ''}">
                    <td class="text-[#474d57] font-semibold text-[11px]">${index + 1}</td>
                    <td class="font-bold text-white">
                        <div class="flex items-center gap-2 uppercase tracking-tighter">
                            ${coin.s}
                            ${coin.isBrk ? '<span class="text-[8px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-1 rounded font-black">Brk</span>' : ''}
                        </div>
                    </td>
                    <td class="text-right font-medium">$${coin.p < 1 ? coin.p.toFixed(5) : coin.p.toLocaleString()}</td>
                    <td class="text-right font-bold ${coin.pct >= 0 ? 'text-[#02c076]' : 'text-[#f84960]'}">
                        ${coin.pct >= 0 ? '+' : ''}${coin.pct.toFixed(2)}%
                    </td>
                    <td class="text-right font-medium text-[#848e9c]">${formatVol(coin.v24)}</td>
                </tr>
            `).join('');
        }

        updateTF('15m');
        setInterval(runScreener, 20000);
    </script>
</body>
</html>
