<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuantPulse v4.2 | Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap');
        :root { --bg: #05070a; --accent: #f3ba2f; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: #f0f2f5; min-height: 100vh; }
        .glass { background: rgba(23, 27, 34, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 24px; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .tf-btn.active { background: var(--accent); color: #000; box-shadow: 0 0 15px rgba(243, 186, 47, 0.3); }
        .breakout-card { border: 1px solid rgba(16, 185, 129, 0.4); background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, transparent 100%); }
    </style>
</head>
<body class="pb-10">

    <div class="max-w-xl mx-auto px-4 pt-8">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-2xl font-extrabold tracking-tighter italic text-white">QUANT<span class="text-[var(--accent)] not-italic">PULSE</span></h1>
            <div id="status" class="text-[10px] mono text-gray-500 font-bold uppercase tracking-widest bg-white/5 px-3 py-1 rounded-full border border-white/10">Initial Sync...</div>
        </header>

        <div class="glass p-5 mb-6 space-y-4">
            <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                <button onclick="updateTF('5m')" id="btn-5m" class="tf-btn px-4 py-2 rounded-xl text-[10px] font-black bg-white/5 border border-white/5">5M</button>
                <button onclick="updateTF('15m')" id="btn-15m" class="tf-btn px-4 py-2 rounded-xl text-[10px] font-black bg-white/5 border border-white/5">15M</button>
                <button onclick="updateTF('1h')" id="btn-1h" class="tf-btn px-4 py-2 rounded-xl text-[10px] font-black bg-white/5 border border-white/5">1H</button>
                <button onclick="updateTF('4h')" id="btn-4h" class="tf-btn px-4 py-2 rounded-xl text-[10px] font-black bg-white/5 border border-white/5">4H</button>
                <button onclick="updateTF('1d')" id="btn-1d" class="tf-btn px-4 py-2 rounded-xl text-[10px] font-black bg-white/5 border border-white/5 active">24H</button>
            </div>
            
            <div class="flex items-center justify-between gap-4">
                <input type="text" id="search-input" placeholder="Search (e.g. BTC)..." class="flex-1 bg-black/40 border border-white/10 rounded-xl py-2 px-4 text-xs focus:outline-none focus:border-[var(--accent)] transition-all">
                <label class="flex items-center cursor-pointer">
                    <span class="text-[9px] font-bold text-gray-400 uppercase mr-2">Breakouts</span>
                    <input type="checkbox" id="breakout-toggle" class="sr-only peer" onchange="runScreener()">
                    <div class="w-8 h-4 bg-white/10 rounded-full peer peer-checked:bg-emerald-500 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:after:translate-x-4 relative"></div>
                </label>
            </div>
        </div>

        <div id="screener-list" class="space-y-3"></div>
    </div>

    <script>
        const API_BASE = "https://fapi.binance.com/fapi/v1";
        let activeTF = '1d';
        let customSymbols = [];

        async function updateTF(tf) {
            activeTF = tf;
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${tf}`).classList.add('active');
            runScreener();
        }

        function formatVol(val) {
            if (val >= 1e9) return (val/1e9).toFixed(1) + 'B';
            if (val >= 1e6) return (val/1e6).toFixed(1) + 'M';
            return (val/1e3).toFixed(0) + 'K';
        }

        async function fetchSymbolData(symbol, tf) {
            try {
                // Fetch 11 candles for Donchian (prev 10) + current TF stats (11th)
                const res = await fetch(`${API_BASE}/klines?symbol=${symbol}&interval=${tf}&limit=11`);
                const k = await res.json();
                
                const prevTen = k.slice(0, 10);
                const currentCandle = k[10]; // Current live candle
                
                const donchianHigh = Math.max(...prevTen.map(c => parseFloat(c[2])));
                const currentPrice = parseFloat(currentCandle[4]);
                const openPrice = parseFloat(currentCandle[1]);
                
                // DATA FOR SELECTED TIMEFRAME
                const tfPercentage = ((currentPrice - openPrice) / openPrice) * 100;
                const tfVolume = parseFloat(currentCandle[7]); // [7] is Quote Asset Volume (e.g. USDT volume)
                const isBreakout = currentPrice > donchianHigh;

                return { s: symbol.replace('USDT',''), p: currentPrice, dh: donchianHigh, tfChange: tfPercentage, tfVol: tfVolume, isBreakout };
            } catch (e) { return null; }
        }

        async function runScreener() {
            const showOnly = document.getElementById('breakout-toggle').checked;
            try {
                const res = await fetch(`${API_BASE}/ticker/24hr`);
                const all = await res.json();
                
                let targets = customSymbols.length > 0 ? customSymbols : 
                    all.filter(t => t.symbol.endsWith('USDT') && parseFloat(t.quoteVolume) > 10000000)
                       .sort((a,b) => parseFloat(b.priceChangePercent) - parseFloat(a.priceChangePercent))
                       .slice(0, 20).map(t => t.symbol);

                let data = await Promise.all(targets.map(s => fetchSymbolData(s, activeTF)));
                data = data.filter(d => d !== null);
                if (showOnly) data = data.filter(d => d.isBreakout);

                document.getElementById('screener-list').innerHTML = data.sort((a,b) => b.tfChange - a.tfChange).map(coin => `
                    <div class="glass p-4 flex justify-between items-center transition-all ${coin.isBreakout ? 'breakout-card scale-[1.01]' : ''}">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-base font-extrabold text-white tracking-tight">${coin.s}</span>
                                ${coin.isBreakout ? '<span class="text-[7px] bg-emerald-500 text-black px-1 py-0.5 rounded font-black uppercase">Breakout</span>' : ''}
                            </div>
                            <div class="text-[9px] mono text-gray-500">
                                ${activeTF.toUpperCase()} HIGH: <span class="text-white font-bold">$${coin.dh < 1 ? coin.dh.toFixed(5) : coin.dh.toLocaleString()}</span>
                            </div>
                        </div>
                        
                        <div class="text-right">
                            <div class="text-sm font-bold text-white mono mb-1">$${coin.p < 1 ? coin.p.toFixed(5) : coin.p.toLocaleString()}</div>
                            <div class="flex flex-col items-end gap-0.5">
                                <span class="text-[9px] font-black mono ${coin.tfChange >= 0 ? 'text-emerald-400' : 'text-red-500'}">
                                    ${coin.tfChange >= 0 ? '+' : ''}${coin.tfChange.toFixed(2)}% <span class="text-[7px] opacity-40">(${activeTF})</span>
                                </span>
                                <span class="text-[9px] font-bold text-[var(--accent)] mono uppercase tracking-tighter">
                                    Vol: $${formatVol(coin.tfVol)}
                                </span>
                            </div>
                        </div>
                    </div>
                `).join('');
                document.getElementById('status').innerText = `SYNC: ${new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
            } catch (e) { console.error(e); }
        }

        function handleSearch() {
            const val = document.getElementById('search-input').value.trim().toUpperCase();
            if (val) {
                customSymbols = val.split(',').map(s => s.trim().endsWith('USDT') ? s.trim() : s.trim() + 'USDT');
                runScreener();
            }
        }

        updateTF('1d');
        setInterval(runScreener, 15000);
    </script>
</body>
</html>
