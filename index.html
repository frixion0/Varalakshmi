<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Live Screener - Squeeze Pro Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0b0e11;--card:#181a20;--border:#2b3139;--text:#eaecef;--dim:#848e9c;--green:#0ecb81;--red:#f6465d;--accent:#fcd535;--orange:#f0b90b;--pink:#ff78f8;--blue:#3d7eff;--cyan:#00d4aa;--table-font:16px}
        *{box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;margin:0;padding:10px;overflow-x:hidden}
        body.modal-open{overflow:hidden}
        .header-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
        .search-box{flex:1;min-width:150px}
        .search-box input{width:100%;background:var(--card);border:1px solid var(--border);padding:8px 12px;border-radius:4px;color:#fff;outline:none;font-size:13px}
        .size-control{display:flex;align-items:center;gap:8px;background:var(--card);padding:5px 12px;border-radius:4px;border:1px solid var(--border);font-size:11px}
        .status-bar{flex:2;min-width:300px;background:#1e2026;padding:8px 15px;border-radius:8px;border:1px solid var(--border)}
        #scan-status{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;font-weight:bold}
        #net-status{font-size:9px;color:var(--dim);margin-top:3px;letter-spacing:.5px;display:flex;gap:10px;flex-wrap:wrap}
        .ns-dot{width:6px;height:6px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:3px}
        .ns-dot.on{background:var(--green);box-shadow:0 0 4px var(--green)}
        .ns-dot.off{background:var(--red);box-shadow:0 0 4px var(--red);animation:blink 1s infinite}
        .ns-dot.warn{background:var(--orange);box-shadow:0 0 4px var(--orange)}
        @keyframes blink{50%{opacity:.3}}
        .tabs{display:flex;gap:5px;margin-bottom:10px}
        .tab{padding:6px 18px;font-size:11px;cursor:pointer;border-radius:4px;color:var(--dim);background:var(--card);border:1px solid var(--border);font-weight:bold}
        .tab.active{color:#000;background:var(--accent);border-color:var(--accent);box-shadow:0 0 15px rgba(252,213,53,.3)}
        .main-grid{display:flex;gap:10px;width:100%}
        .table-container{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
        .table-container.watchlist-panel{flex:0 0 420px;min-width:340px}
        .table-title{padding:8px 12px;font-weight:900;font-size:13px;background:#1e2026;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .table-title .wl-count{font-size:10px;color:var(--dim);font-weight:600}
        .scroll-area{max-height:82vh;overflow-y:auto;width:100%;flex:1}
        table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:var(--table-font)}
        th{position:sticky;top:0;background:#1e2026;color:var(--dim);font-size:10px;padding:8px 2px;text-align:right;z-index:10;border-bottom:1px solid var(--border)}
        td{padding:6px 4px;text-align:right;border-bottom:1px solid rgba(255,255,255,.03);font-family:'JetBrains Mono',monospace;white-space:nowrap}
        th.active-header{color:var(--accent);background:#2c2f36;border-bottom:2px solid var(--accent)}
        td.active-col{background:rgba(252,213,53,.08)!important;font-weight:bold;color:#fff}
        .badge{font-size:7.5px;padding:1px 3px;border-radius:2px;margin-left:3px;font-weight:900;vertical-align:middle;text-transform:uppercase;display:inline-block}
        .top-badge{background:var(--accent);color:#000}
        .bo-badge{background:var(--green);color:#000;box-shadow:0 0 5px rgba(14,203,129,.3)}
        .d1-badge{background:var(--pink);color:#000}
        .sq-badge{background:var(--blue);color:#fff;box-shadow:0 0 5px rgba(61,126,255,.5)}
        .golden-zone{background:linear-gradient(90deg,rgba(252,213,53,.12) 0%,transparent 100%)!important}
        .col-rank{width:25px;text-align:left;padding-left:5px}
        .col-sym{width:155px;text-align:left;position:sticky;left:0;background:var(--card);z-index:5;border-right:1px solid var(--border);color:#fff;font-weight:bold;cursor:pointer;transition:background .15s}
        .col-sym:hover{background:#252830}
        .col-price{width:85px}.col-pct{width:60px}.col-vol{width:70px;color:var(--orange)}.col-action{width:30px}
        .watchlist-panel .wl-sym{width:100px;text-align:left;position:sticky;left:0;background:var(--card);z-index:5;border-right:1px solid var(--border);color:#fff;font-weight:bold;cursor:pointer;transition:background .15s}
        .watchlist-panel .wl-sym:hover{background:#252830}
        .watchlist-panel .wl-price{width:90px}.watchlist-panel .wl-pct{width:75px}.watchlist-panel .wl-vol{width:95px;color:var(--orange)}.watchlist-panel .wl-action{width:28px}
        .btn-remove{background:none;border:1px solid var(--border);color:var(--dim);cursor:pointer;border-radius:3px;font-size:14px;line-height:1;padding:2px 5px;transition:all .15s}
        .btn-remove:hover{background:var(--red);color:#fff;border-color:var(--red)}
        .btn-add{background:none;border:1px solid var(--border);color:var(--dim);cursor:pointer;border-radius:3px;font-size:11px;line-height:1;padding:2px 5px;transition:all .15s}
        .btn-add:hover{background:var(--accent);color:#000;border-color:var(--accent)}
        .wl-empty{text-align:center;padding:40px 10px;color:var(--dim);font-size:12px}
        .wl-empty span{font-size:20px;display:block;margin-bottom:8px;opacity:.4}
        .green{color:var(--green)}.red{color:var(--red)}
        .chart-overlay{position:fixed;inset:0;z-index:9999;background:var(--bg);display:none;flex-direction:column}
        .chart-overlay.open{display:flex}
        .chart-topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;min-height:40px;gap:8px}
        .chart-topbar .chart-sym-name{font-size:15px;font-weight:900;color:var(--accent);white-space:nowrap}
        .chart-topbar .chart-info{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--dim);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
        .chart-topbar .chart-info .ci-val{color:var(--text)}
        .chart-tf-btns{display:flex;gap:3px;flex-shrink:0}
        .ctf{padding:3px 7px;font-size:9px;cursor:pointer;border-radius:3px;color:var(--dim);background:transparent;border:1px solid var(--border);font-weight:700;font-family:'JetBrains Mono',monospace;transition:all .15s}
        .ctf.active{color:#000;background:var(--accent);border-color:var(--accent)}
        .ctf:hover:not(.active){color:var(--text);border-color:var(--dim)}
        .chart-close,.chart-settings-btn{background:none;border:1px solid var(--border);color:var(--dim);cursor:pointer;font-size:16px;width:30px;height:30px;border-radius:4px;transition:all .15s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .chart-close:hover{background:var(--red);color:#fff;border-color:var(--red)}
        .chart-settings-btn:hover,.chart-settings-btn.active-btn{background:var(--accent);color:#000;border-color:var(--accent)}
        .chart-body{flex:1;position:relative;overflow:hidden;cursor:crosshair;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
        .chart-body canvas{display:block;width:100%;height:100%}
        .ind-panel{position:absolute;top:0;right:0;width:282px;max-width:82vw;height:100%;background:#13161c;border-left:1px solid var(--border);z-index:100;transform:translateX(100%);transition:transform .25s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden;touch-action:auto}
        .ind-panel.open{transform:translateX(0)}
        .ind-panel-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
        .ind-panel-head span{font-weight:900;font-size:11px;color:var(--accent);letter-spacing:.5px}
        .ind-panel-close{background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:3px;transition:all .15s}
        .ind-panel-close:hover{color:var(--red)}
        .ind-panel-body{flex:1;overflow-y:auto;padding:8px 0;-webkit-overflow-scrolling:touch}
        .ind-section{padding:4px 12px 10px}
        .ind-section-title{font-size:8px;font-weight:900;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,.05)}
        .ind-row{display:flex;align-items:center;gap:5px;margin-bottom:6px}
        .ind-toggle{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;cursor:pointer;color:var(--text);min-width:56px}
        .ind-toggle input{display:none}
        .ind-toggle .sw{width:26px;height:14px;border-radius:7px;background:#2b3139;position:relative;transition:background .2s;flex-shrink:0}
        .ind-toggle .sw::after{content:'';position:absolute;top:2px;left:2px;width:10px;height:10px;border-radius:50%;background:var(--dim);transition:all .2s}
        .ind-toggle input:checked+.sw{background:var(--green)}
        .ind-toggle input:checked+.sw::after{left:14px;background:#fff}
        .ind-period{width:40px;background:#1e2026;border:1px solid var(--border);color:var(--text);padding:3px 4px;border-radius:3px;font-size:10px;font-family:'JetBrains Mono',monospace;text-align:center;outline:none}
        .ind-period:focus{border-color:var(--accent)}
        .ind-width{width:34px;background:#1e2026;border:1px solid var(--border);color:var(--text);padding:3px 2px;border-radius:3px;font-size:9px;font-family:'JetBrains Mono',monospace;text-align:center;outline:none}
        .ind-width:focus{border-color:var(--accent)}
        .sty-btn{font-size:12px;padding:0 3px;border-radius:2px;cursor:pointer;color:var(--dim);border:1px solid transparent;transition:all .1s;line-height:1}
        .sty-btn.active{color:var(--accent);border-color:var(--accent)}
        .sty-btn:hover:not(.active){color:var(--text)}
        .ind-color{width:18px;height:18px;border-radius:3px;cursor:pointer;border:2px solid transparent;transition:border-color .15s;flex-shrink:0}
        .ind-color:hover{border-color:var(--text)}
        .ind-sub{display:flex;align-items:center;gap:6px;margin-bottom:5px;padding-left:0}
        .ind-label-sm{font-size:8px;color:var(--dim);font-weight:700;letter-spacing:.3px}
        .cp-popup{position:fixed;z-index:10002;display:none;background:#1e2026;border:1px solid var(--border);border-radius:8px;padding:6px;flex-wrap:wrap;gap:4px;width:116px;box-shadow:0 4px 24px rgba(0,0,0,.7)}
        .cp-popup.show{display:flex}
        .cpick{width:22px;height:22px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:all .1s}
        .cpick:hover{border-color:#fff;transform:scale(1.15)}
        .ind-reset{display:block;margin:8px 12px 14px;padding:7px;text-align:center;background:transparent;border:1px solid var(--border);color:var(--dim);font-size:9px;font-weight:700;border-radius:4px;cursor:pointer;transition:all .15s;letter-spacing:.5px}
        .ind-reset:hover{border-color:var(--red);color:var(--red)}
        @media(max-width:1100px){.main-grid{flex-direction:column}.table-container.watchlist-panel{flex:none;min-width:0}}
    </style>
</head>
<body>
<div class="header-row">
    <div class="search-box"><input type="text" id="cryptoSearch" placeholder="Search Assets..." oninput="render()"></div>
    <div class="size-control"><span>A-</span><input type="range" min="8" max="18" value="16" id="sizeSlider" oninput="updateSize(this.value)"><span>A+</span></div>
    <div class="status-bar"><div id="scan-status">Initializing...</div><div id="net-status"></div></div>
</div>
<div class="tabs">
    <div class="tab" id="tab-5m" onclick="setRank('5m')">5M</div>
    <div class="tab" id="tab-15m" onclick="setRank('15m')">15M</div>
    <div class="tab" id="tab-1h" onclick="setRank('1h')">1H</div>
    <div class="tab active" id="tab-24h" onclick="setRank('24h')">24H</div>
</div>
<div class="main-grid">
    <div class="table-container">
        <div class="table-title" style="color:var(--green)">LIVE SCREENER <span style="font-size:9px;color:var(--dim);font-weight:500;margin-left:8px">Click symbol for chart · + to watch</span></div>
        <div class="scroll-area"><table><thead><tr>
            <th class="col-rank">#</th><th class="col-sym">Symbol</th><th class="col-price">Price</th>
            <th class="col-pct h-5m" data-tf="5m">5M%</th><th class="col-pct h-15m" data-tf="15m">15M%</th><th class="col-pct h-1h" data-tf="1h">1H%</th><th class="col-pct h-24h" data-tf="24h">24H%</th>
            <th class="col-vol">TF Vol</th><th class="col-vol">24H Vol</th><th class="col-action"></th>
        </tr></thead><tbody id="gainers-body"></tbody></table></div>
    </div>
    <div class="table-container watchlist-panel">
        <div class="table-title" style="color:var(--accent)"><span>&#9733; WATCHLIST</span><span class="wl-count" id="wl-count">0 assets</span></div>
        <div class="scroll-area"><table><thead><tr>
            <th class="col-rank">#</th><th class="wl-sym">Symbol</th><th class="wl-price">Price</th>
            <th class="wl-pct" data-tf="24h">24H%</th><th class="wl-vol">24H Vol</th><th class="wl-action"></th>
        </tr></thead><tbody id="watchlist-body"></tbody></table>
        <div class="wl-empty" id="wl-empty"><span>+</span>Click + on any symbol to start tracking</div></div>
    </div>
</div>
<div class="chart-overlay" id="chartOverlay">
    <div class="chart-topbar">
        <div style="display:flex;align-items:center;gap:6px;min-width:0">
            <span class="chart-sym-name" id="chartSymName">BTC</span>
            <div class="chart-info" id="chartInfo"></div>
        </div>
        <div class="chart-tf-btns" id="chartTfBtns">
            <span class="ctf" data-iv="1m" onclick="changeChartTf('1m')">1m</span>
            <span class="ctf" data-iv="5m" onclick="changeChartTf('5m')">5m</span>
            <span class="ctf" data-iv="15m" onclick="changeChartTf('15m')">15m</span>
            <span class="ctf" data-iv="1h" onclick="changeChartTf('1h')">1h</span>
            <span class="ctf" data-iv="4h" onclick="changeChartTf('4h')">4h</span>
            <span class="ctf" data-iv="1d" onclick="changeChartTf('1d')">1d</span>
        </div>
        <button class="chart-settings-btn" id="chartSettingsBtn" onclick="toggleIndPanel()">&#9881;</button>
        <button class="chart-close" onclick="closeChart()">&#10005;</button>
    </div>
    <div class="chart-body" id="chartBody">
        <canvas id="chartCanvas"></canvas>
        <div class="ind-panel" id="indPanel">
            <div class="ind-panel-head"><span>INDICATORS</span><button class="ind-panel-close" onclick="toggleIndPanel()">&#10005;</button></div>
            <div class="ind-panel-body" id="indPanelBody"></div>
            <button class="ind-reset" onclick="resetIndDefaults()">RESET DEFAULTS</button>
        </div>
    </div>
</div>
<div class="cp-popup" id="colorPickerPopup"></div>

<script>
var API_URL="https://fapi.binance.com/fapi/v1",WS_URL="wss://fstream.binance.com/ws";
var pairs={},rankBy='24h',isSyncing=false,watchlist=new Set(),renderPending=false;
var restWeightUsed=0,restWindowStart=Date.now(),restPaused=false,restPauseUntil=0;
var wsAlive=false,mainWs=null,restFallbackTimer=null;
try{JSON.parse(localStorage.getItem('sq_watchlist')||'[]').forEach(function(s){watchlist.add(s)})}catch(e){}
function saveWatchlist(){localStorage.setItem('sq_watchlist',JSON.stringify(Array.from(watchlist)))}
function saveCache(){try{var d={};for(var s in pairs){var p=pairs[s];d[s]={symbol:p.symbol,price:p.price,vol24h:p.vol24h,'24h':p['24h'],'5m':p['5m'],'15m':p['15m'],'1h':p['1h'],v5m:p.v5m,v15m:p.v15m,v1h:p.v1h,o5m:p.o5m,o15m:p.o15m,o1h:p.o1h,sqz:{'5m':p.sqz['5m'],'15m':p.sqz['15m'],'1h':p.sqz['1h'],'1d':p.sqz['1d'],'d50':p.sqz['d50']},_scanned:!!p._scanned}}sessionStorage.setItem('sq_cache',JSON.stringify(d))}catch(e){}}
function loadCache(){try{var r=sessionStorage.getItem('sq_cache');if(!r)return false;var d=JSON.parse(r),c=0;for(var s in d){pairs[s]=d[s];c++}return c>0}catch(e){return false}}

async function safeFetch(path,weight){
    while(restPaused){var w=restPauseUntil-Date.now();if(w<=0){restPaused=false;restWeightUsed=0;restWindowStart=Date.now();break}updateNetStatus();await new Promise(function(r){setTimeout(r,Math.min(w,5000))})}
    var att=0;while(att<60){att++;var now=Date.now();if(now-restWindowStart>=60000){restWeightUsed=0;restWindowStart=now}if(restWeightUsed+weight<=2100)break;var sl=60000-(now-restWindowStart)+500;updateNetStatus();await new Promise(function(r){setTimeout(r,Math.min(sl,5000))})}
    restWeightUsed+=weight;updateNetStatus();
    try{var res=await fetch(API_URL+path);try{var hw=res.headers.get('x-mbx-used-weight-1m');if(hw){restWeightUsed=parseInt(hw)||restWeightUsed;restWindowStart=Date.now()}}catch(e){}updateNetStatus();
    if(res.status===429){restPaused=true;restPauseUntil=Date.now()+60000;restWeightUsed=99999;updateNetStatus();return null}return res}
    catch(e){restWeightUsed=Math.max(0,restWeightUsed-weight);updateNetStatus();throw e}}

function connectMainWs(){try{mainWs=new WebSocket(WS_URL+'/!miniTicker@arr')}catch(e){wsAlive=false;startRestFallback();return}
mainWs.onopen=function(){wsAlive=true;updateNetStatus()};
mainWs.onmessage=function(ev){try{var msg=JSON.parse(ev.data),tickers=Array.isArray(msg)?msg:[msg];for(var i=0;i<tickers.length;i++){var t=tickers[i];if(!t.s||!t.s.endsWith('USDT'))continue;var sym=t.s,price=parseFloat(t.c),qVol=parseFloat(t.q)||0,open24=parseFloat(t.o)||0;
if(!pairs[sym])pairs[sym]={symbol:sym.replace('USDT',''),price:price,vol24h:qVol,'24h':0,o5m:null,o15m:null,o1h:null,sqz:{'5m':false,'15m':false,'1h':false,'1d':false,'d50':false},v5m:0,v15m:0,v1h:0,'5m':0,'15m':0,'1h':0};
else{pairs[sym].price=price;pairs[sym].vol24h=qVol}if(open24>0)pairs[sym]['24h']=((price-open24)/open24*100);calculatePcts(sym)}scheduleRender()}catch(e){}};
mainWs.onclose=function(){wsAlive=false;updateNetStatus();setTimeout(function(){if(!wsAlive)connectMainWs()},3000)};
mainWs.onerror=function(){wsAlive=false;updateNetStatus();try{mainWs.close()}catch(e){}}}
function startRestFallback(){if(restFallbackTimer)return;updateNetStatus();restFallbackTimer=setInterval(function(){safeFetch('/ticker/24hr',40).then(function(r){if(!r)return;return r.json()}).then(function(d){if(!d||!Array.isArray(d))return;for(var i=0;i<d.length;i++){var t=d[i];if(!t.symbol.endsWith('USDT'))continue;var s=t.symbol;if(!pairs[s])pairs[s]={symbol:s.replace('USDT',''),price:parseFloat(t.lastPrice),vol24h:parseFloat(t.quoteVolume),'24h':parseFloat(t.priceChangePercent),o5m:null,o15m:null,o1h:null,sqz:{'5m':false,'15m':false,'1h':false,'1d':false,'d50':false},v5m:0,v15m:0,v1h:0,'5m':0,'15m':0,'1h':0};else{pairs[s].price=parseFloat(t.lastPrice);pairs[s].vol24h=parseFloat(t.quoteVolume);pairs[s]['24h']=parseFloat(t.priceChangePercent)}calculatePcts(s)}scheduleRender()}).catch(function(){})},10000)}
function scheduleRender(){if(renderPending)return;renderPending=true;requestAnimationFrame(function(){renderPending=false;render()})}
function updateNetStatus(){var el=document.getElementById('net-status');if(!el)return;var wd,ws;if(wsAlive){wd='on';ws='WS LIVE'}else if(restFallbackTimer){wd='warn';ws='REST FALLBACK'}else{wd='off';ws='WS OFF'}var wc='var(--dim)',wt='W:'+restWeightUsed;if(restPaused){wc='var(--red)';var s=Math.ceil((restPauseUntil-Date.now())/1000);wt='429 PAUSED '+s+'s'}else if(restWeightUsed>1800)wc='var(--orange)';el.innerHTML='<span><span class="ns-dot '+wd+'"></span>'+ws+'</span><span style="color:'+wc+'">'+wt+'</span>'}

var currentChartSym=null,chartRAF=null,chartWs=null,chartDirty=true;
var chartCandles=[],chartInterval='5m',chartZoom=120,chartOffset=0;
var chartMX=-1,chartMY=-1,CHART_PR=68;
var LINE_STYLES=[[],[6,3],[2,2]];

/* ═══ CHANGED: Added width to all indicators, showMid to Donchian ═══ */
var PRESET_COLORS=['#fcd535','#00d4aa','#ff78f8','#3d7eff','#f0b90b','#0ecb81','#f6465d','#ff6b35','#eaecef','#848e9c','#00bcd4','#e040fb'];
var DEF_IND={
    ema:[{enabled:true,period:9,color:'#fcd535',style:0,width:1.2},{enabled:true,period:21,color:'#00d4aa',style:0,width:1.2},{enabled:true,period:50,color:'#ff78f8',style:0,width:1.2}],
    donchian:{enabled:true,period:20,color:'#3d7eff',style:0,fill:true,showMid:true,width:1.5},
    bollinger:{enabled:false,period:20,mult:2.0,color:'#ff6b35',style:0,fill:true,width:1},
    macd:{enabled:true,fast:12,slow:26,signal:9,macdColor:'#3d7eff',signalColor:'#f0b90b',histP:'#0ecb81',histN:'#f6465d',style:0,width:1.2},
    rsi:{enabled:true,period:14,ob:70,os:30,color:'#3d7eff',style:0,width:1.2},
    volMA:{enabled:true,period:20,color:'#f0b90b',style:0,width:1}

function calcEMA(d,p){var e=[],k=2/(p+1);if(!d.length)return e;e[0]=d[0];for(var i=1;i<d.length;i++)e[i]=d[i]*k+e[i-1]*(1-k);return e}

function calcRSI(cl,p){var r=[];if(cl.length<p)return[];for(var i=0;i<p;i++)r.push(50);var g=0,l=0;for(var i=1;i<=p;i++){var d=cl[i]-cl[i-1];if(d>0)g+=d;else l-=d}var ag=g/p,al=l/p;r[p-1]=al===0?100:100-100/(1+ag/al);for(var i=p;i<cl.length;i++){var d=cl[i]-cl[i-1];ag=(ag*(p-1)+(d>0?d:0))/p;al=(al*(p-1)+(d<0?-d:0))/p;r[i]=al===0?100:100-100/(1+ag/al)}return r}
function calcDonch(hi,lo,p){var u=[],l=[],m=[];for(var i=0;i<hi.length;i++){if(i<p-1){u.push(null);l.push(null);m.push(null);continue}var mx=-Infinity,mn=Infinity;for(var j=i-p+1;j<=i;j++){if(hi[j]>mx)mx=hi[j];if(lo[j]<mn)mn=lo[j]}u.push(mx);l.push(mn);m.push((mx+mn)/2)}return{u:u,l:l,m:m}}
function calcBoll(cl,p,mult){var u=[],l=[],m=[],sma=calcSMA(cl,p);for(var i=0;i<cl.length;i++){m.push(sma[i]);if(sma[i]===null){u.push(null);l.push(null);continue}var sq=0;for(var j=i-p+1;j<=i;j++)sq+=(cl[j]-sma[i])*(cl[j]-sma[i]);u.push(sma[i]+mult*Math.sqrt(sq/p));l.push(sma[i]-mult*Math.sqrt(sq/p))}return{u:u,l:l,m:m}}

chartBodyEl.addEventListener('touchstart',function(e){if(!currentChartSym)return;e.preventDefault();gesture.isTouch=true;var rect=chartCanvasEl.getBoundingClientRect(),cw=rect.width;if(gesture.momentumRAF){cancelAnimationFrame(gesture.momentumRAF);gesture.momentumRAF=null}clearTimeout(gesture.longPressTimer);if(gesture.resetBtn&&e.touches.length===1){var t0=e.touches[0],bx=t0.clientX-rect.left,by=t0.clientY-rect.top,rb=gesture.resetBtn;if((bx-rb.x)*(bx-rb.x)+(by-rb.y)*(by-rb.y)<=rb.r*rb.r){chartOffset=0;chartDirty=true;return}}if(e.touches.length===1){var t=e.touches[0],x=t.clientX-rect.left,y=t.clientY-rect.top,now=Date.now();gesture.startTime=now;gesture.startX=x;gesture.startY=y;gesture.lastX=x;gesture.lastY=y;gesture.moved=false;gesture.velocityX=0;gesture.lastMoveTime=0;if(gesture.crosshairActive){gesture.mode='crosshair-pending';gesture.longPressTimer=setTimeout(function(){gesture.mode='crosshair';chartMX=gesture.startX;chartMY=gesture.startY;chartDirty=true},250);return}if(now-gesture.lastTapTime<320&&isInPS(x,cw)&&isInPS(gesture.lastTapX,cw)){gesture.priceAuto=true;gesture.priceZoom=1;gesture.lastTapTime=0;chartDirty=true;return}gesture.lastTapTime=now;gesture.lastTapX=x;if(isInPS(x,cw)){gesture.mode='price-scale';gesture.priceAuto=false}else{gesture.mode=null;gesture.longPressTimer=setTimeout(function(){gesture.mode='crosshair';gesture.crosshairActive=true;chartMX=gesture.startX;chartMY=gesture.startY;chartDirty=true},550)}}else if(e.touches.length===2){if(gesture.crosshairActive){gesture.crosshairActive=false;chartMX=-1;chartMY=-1;chartDirty=true}gesture.mode='pinch';gesture.pinchStartDist=touchDist(e.touches[0],e.touches[1]);gesture.pinchStartZoom=chartZoom;gesture.pinchStartOffset=chartOffset;gesture.pinchFrac=((e.touches[0].clientX+e.touches[1].clientX)/2-rect.left)/cw}},{passive:false});
chartBodyEl.addEventListener('touchmove',function(e){if(!currentChartSym)return;e.preventDefault();var rect=chartCanvasEl.getBoundingClientRect(),cw=rect.width,now=Date.now();if(e.touches.length===1&&gesture.mode!=='pinch'){var t=e.touches[0],x=t.clientX-rect.left,y=t.clientY-rect.top,dx=x-gesture.lastX,dy=y-gesture.lastY,tDx=x-gesture.startX,tDy=y-gesture.startY;if(gesture.mode===null){if(Math.abs(tDx)>8||Math.abs(tDy)>8){gesture.moved=true;clearTimeout(gesture.longPressTimer);gesture.mode=isInPS(gesture.startX,cw)?'price-scale':'swipe';if(gesture.mode==='price-scale')gesture.priceAuto=false}}if(gesture.mode==='crosshair-pending'){if(Math.abs(tDx)>8||Math.abs(tDy)>8){gesture.crosshairActive=false;chartMX=-1;chartMY=-1;clearTimeout(gesture.longPressTimer);gesture.mode='swipe';gesture.moved=true;chartDirty=true}return}if(gesture.mode==='swipe'){chartOffset=clampOffset(chartOffset+dx*chartZoom/(cw-CHART_PR),chartZoom,chartCandles.length);chartDirty=true}else if(gesture.mode==='crosshair'){chartMX=x;chartMY=y;chartDirty=true}else if(gesture.mode==='price-scale'){gesture.priceZoom=Math.max(0.15,Math.min(10,gesture.priceZoom*Math.pow(1.004,dy)));gesture.priceAuto=false;chartDirty=true}if(gesture.mode==='swipe'){var dt=now-(gesture.lastMoveTime||now);if(dt>0)gesture.velocityX=dx/dt;gesture.lastMoveTime=now}gesture.lastX=x;gesture.lastY=y}else if(e.touches.length===2&&gesture.mode==='pinch'){var dist=touchDist(e.touches[0],e.touches[1]),scale=gesture.pinchStartDist/dist,newZ=Math.round(gesture.pinchStartZoom*scale);newZ=Math.max(15,Math.min(chartCandles.length||120,newZ));chartOffset=clampOffset(gesture.pinchStartOffset+(gesture.pinchStartZoom-newZ)*(1-gesture.pinchFrac),newZ,chartCandles.length);chartZoom=newZ;chartDirty=true}},{passive:false});

async function initialLoad(){try{var res=await safeFetch('/ticker/24hr',40);if(!res){setTimeout(initialLoad,5000);return}var data=await res.json();if(!Array.isArray(data))return;for(var i=0;i<data.length;i++){var t=data[i];if(!t.symbol.endsWith('USDT'))continue;var s=t.symbol;if(!pairs[s])pairs[s]={symbol:s.replace('USDT',''),price:parseFloat(t.lastPrice),vol24h:parseFloat(t.quoteVolume),'24h':parseFloat(t.priceChangePercent),o5m:null,o15m:null,o1h:null,sqz:{'5m':false,'15m':false,'1h':false,'1d':false,'d50':false},v5m:0,v15m:0,v1h:0,'5m':0,'15m':0,'1h':0};else{pairs[s].price=parseFloat(t.lastPrice);pairs[s].vol24h=parseFloat(t.quoteVolume);pairs[s]['24h']=parseFloat(t.priceChangePercent)}calculatePcts(s)}render();if(!isSyncing){var u=Object.keys(pairs).filter(function(s){return!pairs[s]._scanned});if(u.length>0)syncMissingOpens(u);else document.getElementById('scan-status').innerText="LIVE: SQUEEZE ENGINE READY"}}catch(e){setTimeout(initialLoad,5000)}}
async function syncMissingOpens(symbols){if(isSyncing)return;isSyncing=true;var wlSet=new Set(Array.from(watchlist).map(function(s){return s+'USDT'}));symbols.sort(function(a,b){var aw=wlSet.has(a)?1:0,bw=wlSet.has(b)?1:0;if(aw!==bw)return bw-aw;return(pairs[b]?pairs[b].vol24h:0)-(pairs[a]?pairs[a].vol24h:0)});var done=0,total=symbols.length,lastRender=0;for(var i=0;i<total;i++){var sym=symbols[i];if(pairs[sym]&&pairs[sym]._scanned){done++;continue}var results=[],failed=false,intervals=['5m','15m','1h','1d'];for(var ti=0;ti<intervals.length;ti++){if(restPaused){failed=true;break}try{var lim=intervals[ti]==='1d'?70:25;var res=await safeFetch('/klines?symbol='+sym+'&interval='+intervals[ti]+'&limit='+lim,5);if(!res){failed=true;break}results.push(await res.json())}catch(e){failed=true;break}}if(!failed&&results.length===4){try{var k5=results[0],k15=results[1],k1=results[2],k1d=results[3];var checkSq=function(data,per,fc){if(!data||data.length<(per+fc))return false;for(var j=0;j<5;j++){var seg=data.slice(data.length-(per+j),data.length-j);if(seg.length<per)break;var hh=[];for(var f=1;f<=fc;f++){var fs=data.slice(data.length-(per+j+f),data.length-j-f);hh.push(Math.max.apply(null,fs.map(function(c){return parseFloat(c[2])})))}if(hh.every(function(h){return h===hh[0]})&&pairs[sym].price>hh[0])return true}return false};if(k5&&k5.length){pairs[sym].o5m=parseFloat(k5[k5.length-1][1]);pairs[sym].v5m=parseFloat(k5[k5.length-1][7]);pairs[sym].sqz['5m']=checkSq(k5,10,5)}if(k15&&k15.length){pairs[sym].o15m=parseFloat(k15[k15.length-1][1]);pairs[sym].v15m=parseFloat(k15[k15.length-1][7]);pairs[sym].sqz['15m']=checkSq(k15,10,5)}if(k1&&k1.length){pairs[sym].o1h=parseFloat(k1[k1.length-1][1]);pairs[sym].v1h=parseFloat(k1[k1.length-1][7]);pairs[sym].sqz['1h']=checkSq(k1,10,5)}if(k1d&&k1d.length){pairs[sym].sqz['1d']=checkSq(k1d,10,5);pairs[sym].sqz['d50']=checkSq(k1d,50,10)}pairs[sym]._scanned=true;calculatePcts(sym)}catch(e){}}done++;if(done-lastRender>=10){lastRender=done;document.getElementById('scan-status').innerText='SQUEEZE: '+Math.round((done/total)*100)+'%';render();saveCache()}}saveCache();document.getElementById('scan-status').innerText="LIVE: SQUEEZE ENGINE READY";isSyncing=false;render()}
function calculatePcts(sym){var p=pairs[sym];if(p.o5m!=null)p['5m']=((p.price-p.o5m)/p.o5m*100);if(p.o15m!=null)p['15m']=((p.price-p.o15m)/p.o15m*100);if(p.o1h!=null)p['1h']=((p.price-p.o1h)/p.o1h*100)}
function getTopSyms(){var l=Object.values(pairs);l.sort(function(a,b){return(b.vol24h||0)-(a.vol24h||0)});var t60=l.slice(0,60).map(function(p){return p.symbol});var wl=Array.from(watchlist);var seen={},u=[];for(var i=0;i<t60.length+wl.length;i++){var s=i<t60.length?t60[i]:wl[i-t60.length];if(!seen[s]){seen[s]=true;u.push(s)}}return u}
async function refreshOpens(iv){if(restPaused)return;var syms=getTopSyms();for(var i=0;i<syms.length;i++){if(restPaused)break;var sym=syms[i]+'USDT';if(!pairs[sym])continue;try{var res=await safeFetch('/klines?symbol='+sym+'&interval='+iv+'&limit=2',5);if(!res)break;var d=await res.json();if(d&&d.length>=2){var op=parseFloat(d[d.length-2][1]),vl=parseFloat(d[d.length-1][7]);if(iv==='5m'){pairs[sym].o5m=op;pairs[sym].v5m=vl}else if(iv==='15m'){pairs[sym].o15m=op;pairs[sym].v15m=vl}else if(iv==='1h'){pairs[sym].o1h=op;pairs[sym].v1h=vl}calculatePcts(sym)}}catch(e){}}scheduleRender()}
function setRank(key){rankBy=key;var tabs=document.querySelectorAll('.tab');for(var i=0;i<tabs.length;i++)tabs[i].classList.remove('active');document.getElementById('tab-'+key).classList.add('active');highlightHeaders();render()}
function formatVol(v){if(!v)return'0';if(v>=1e9)return(v/1e9).toFixed(1)+'B';if(v>=1e6)return(v/1e6).toFixed(1)+'M';return Math.round(v).toLocaleString()}
function buildBadges(p,leaders,tfs){var b='',ig=false;for(var i=0;i<tfs.length;i++){if(leaders[tfs[i]]===p.symbol){b+='<span class="badge top-badge">'+tfs[i]+'</span>';ig=true}}if(p.sqz['5m'])b+='<span class="badge bo-badge">5M</span>';if(p.sqz['15m'])b+='<span class="badge bo-badge">15M</span>';if(p.sqz['1h'])b+='<span class="badge bo-badge">1H</span>';if(p.sqz['1d'])b+='<span class="badge d1-badge">1D</span>';if(p.sqz['d50'])b+='<span class="badge sq-badge">SQZ 50</span>';return{badges:b,isGolden:ig}}
function render(){highlightHeaders();var q=document.getElementById('cryptoSearch').value.toUpperCase(),fl=[];for(var k in pairs)fl.push(pairs[k]);var tfs=['5m','15m','1h','24h'],ld={};for(var ti=0;ti<tfs.length;ti++){var tf=tfs[ti],top={tf:-999};for(var fi=0;fi<fl.length;fi++){if((fl[fi][tf]||-999)>(top[tf]||-999))top=fl[fi]}if(top.symbol)ld[tf]=top.symbol}var list=q?fl.filter(function(p){return p.symbol.indexOf(q)!==-1}):fl;list.sort(function(a,b){return(b[rankBy]||-999)-(a[rankBy]||-999)});var t60=list.slice(0,60);var mh='';for(var i=0;i<t60.length;i++){var p=t60[i],tv=rankBy==='5m'?p.v5m:rankBy==='15m'?p.v15m:rankBy==='1h'?p.v1h:p.vol24h;var bd=buildBadges(p,ld,tfs),iw=watchlist.has(p.symbol),ps=p.price<1?'$'+p.price.toFixed(5):'$'+p.price.toLocaleString();mh+='<tr class="'+(bd.isGolden?'golden-zone':'')+'"><td class="col-rank">'+(i+1)+'</td><td class="col-sym" onclick="openChart(\''+p.symbol+'\')">'+p.symbol+bd.badges+'</td><td class="col-price">'+ps+'</td><td class="col-pct '+(p['5m']>=0?'green':'red')+' '+(rankBy==='5m'?'active-col':'')+'">'+(p['5m']||0).toFixed(2)+'%</td><td class="col-pct '+(p['15m']>=0?'green':'red')+' '+(rankBy==='15m'?'active-col':'')+'">'+(p['15m']||0).toFixed(2)+'%</td><td class="col-pct '+(p['1h']>=0?'green':'red')+' '+(rankBy==='1h'?'active-col':'')+'">'+(p['1h']||0).toFixed(2)+'%</td><td class="col-pct '+(p['24h']>=0?'green':'red')+' '+(rankBy==='24h'?'active-col':'')+'">'+(p['24h']||0).toFixed(2)+'%</td><td class="col-vol">'+formatVol(tv)+'</td><td class="col-vol">'+formatVol(p.vol24h)+'</td><td class="col-action"><button class="btn-add" onclick="event.stopPropagation();toggleWatch(\''+p.symbol+'\')" style="'+(iw?'color:var(--accent);border-color:var(--accent);':'')+'">'+(iw?'&#9733;':'+')+'</button></td></tr>'}document.getElementById('gainers-body').innerHTML=mh;var ws=Array.from(watchlist),wd=ws.map(function(s){return pairs[s+'USDT']}).filter(Boolean);wd.sort(function(a,b){return(b['24h']||-999)-(a['24h']||-999)});document.getElementById('wl-count').innerText=wd.length+' asset'+(wd.length!==1?'s':'');document.getElementById('wl-empty').style.display=wd.length===0?'block':'none';var wh='';for(var j=0;j<wd.length;j++){var wp=wd[j],wbd=buildBadges(wp,ld,tfs),wps=wp.price<1?'$'+wp.price.toFixed(5):'$'+wp.price.toLocaleString();wh+='<tr class="'+(wbd.isGolden?'golden-zone':'')+'"><td class="col-rank">'+(j+1)+'</td><td class="wl-sym" onclick="openChart(\''+wp.symbol+'\')">'+wp.symbol+wbd.badges+'</td><td class="wl-price">'+wps+'</td><td class="wl-pct '+(wp['24h']>=0?'green':'red')+' '+(rankBy==='24h'?'active-col':'')+'">'+(wp['24h']||0).toFixed(2)+'%</td><td class="wl-vol">'+formatVol(wp.vol24h)+'</td><td class="wl-action"><button class="btn-remove" onclick="event.stopPropagation();toggleWatch(\''+wp.symbol+'\')">&#10005;</button></td></tr>'}document.getElementById('watchlist-body').innerHTML=wh}
