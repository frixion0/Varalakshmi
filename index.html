<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Live Screener - Squeeze Pro Elite</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root{--bg:#0b0e11;--card:#181a20;--border:#2b3139;--text:#eaecef;--dim:#848e9c;--green:#0ecb81;--red:#f6465d;--accent:#fcd535;--orange:#f0b90b;--pink:#ff78f8;--blue:#3d7eff;--cyan:#00d4aa;--table-font:16px}
        *{box-sizing:border-box}
        body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;margin:0;padding:10px;overflow-x:hidden}
        body.modal-open{overflow:hidden}
        .header-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
        .search-box{flex:1;min-width:150px}
        .search-box input{width:100%;background:var(--card);border:1px solid var(--border);padding:8px 12px;border-radius:4px;color:#fff;outline:none;font-size:13px}
        .size-control{display:flex;align-items:center;gap:8px;background:var(--card);padding:5px 12px;border-radius:4px;border:1px solid var(--border);font-size:11px}
        .status-bar{flex:2;min-width:300px;background:#1e2026;padding:8px 15px;border-radius:8px;border:1px solid var(--border)}
        #scan-status{font-size:10px;color:var(--accent);text-transform:uppercase;letter-spacing:1px;font-weight:bold}
        #net-status{font-size:9px;color:var(--dim);margin-top:3px;letter-spacing:.5px;display:flex;gap:10px;flex-wrap:wrap}
        .ns-dot{width:6px;height:6px;border-radius:50%;display:inline-block;vertical-align:middle;margin-right:3px}
        .ns-dot.on{background:var(--green);box-shadow:0 0 4px var(--green)}
        .ns-dot.off{background:var(--red);box-shadow:0 0 4px var(--red);animation:blink 1s infinite}
        .ns-dot.warn{background:var(--orange);box-shadow:0 0 4px var(--orange)}
        @keyframes blink{50%{opacity:.3}}
        .tabs{display:flex;gap:5px;margin-bottom:10px}
        .tab{padding:6px 18px;font-size:11px;cursor:pointer;border-radius:4px;color:var(--dim);background:var(--card);border:1px solid var(--border);font-weight:bold}
        .tab.active{color:#000;background:var(--accent);border-color:var(--accent);box-shadow:0 0 15px rgba(252,213,53,.3)}
        .main-grid{display:flex;gap:10px;width:100%}
        .table-container{flex:1;background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
        .table-container.watchlist-panel{flex:0 0 420px;min-width:340px}
        .table-title{padding:8px 12px;font-weight:900;font-size:13px;background:#1e2026;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .table-title .wl-count{font-size:10px;color:var(--dim);font-weight:600}
        .scroll-area{max-height:82vh;overflow-y:auto;width:100%;flex:1}
        table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:var(--table-font)}
        th{position:sticky;top:0;background:#1e2026;color:var(--dim);font-size:10px;padding:8px 2px;text-align:right;z-index:10;border-bottom:1px solid var(--border)}
        td{padding:6px 4px;text-align:right;border-bottom:1px solid rgba(255,255,255,.03);font-family:'JetBrains Mono',monospace;white-space:nowrap}
        th.active-header{color:var(--accent);background:#2c2f36;border-bottom:2px solid var(--accent)}
        td.active-col{background:rgba(252,213,53,.08)!important;font-weight:bold;color:#fff}
        .badge{font-size:7.5px;padding:1px 3px;border-radius:2px;margin-left:3px;font-weight:900;vertical-align:middle;text-transform:uppercase;display:inline-block}
        .top-badge{background:var(--accent);color:#000}
        .bo-badge{background:var(--green);color:#000;box-shadow:0 0 5px rgba(14,203,129,.3)}
        .d1-badge{background:var(--pink);color:#000}
        .sq-badge{background:var(--blue);color:#fff;box-shadow:0 0 5px rgba(61,126,255,.5)}
        .golden-zone{background:linear-gradient(90deg,rgba(252,213,53,.12) 0%,transparent 100%)!important}
        .col-rank{width:25px;text-align:left;padding-left:5px}
        .col-sym{width:155px;text-align:left;position:sticky;left:0;background:var(--card);z-index:5;border-right:1px solid var(--border);color:#fff;font-weight:bold;cursor:pointer;transition:background .15s}
        .col-sym:hover{background:#252830}
        .col-price{width:85px}.col-pct{width:60px}.col-vol{width:70px;color:var(--orange)}.col-action{width:30px}
        .watchlist-panel .wl-sym{width:100px;text-align:left;position:sticky;left:0;background:var(--card);z-index:5;border-right:1px solid var(--border);color:#fff;font-weight:bold;cursor:pointer;transition:background .15s}
        .watchlist-panel .wl-sym:hover{background:#252830}
        .watchlist-panel .wl-price{width:90px}.watchlist-panel .wl-pct{width:75px}.watchlist-panel .wl-vol{width:95px;color:var(--orange)}.watchlist-panel .wl-action{width:28px}
        .btn-remove{background:none;border:1px solid var(--border);color:var(--dim);cursor:pointer;border-radius:3px;font-size:14px;line-height:1;padding:2px 5px;transition:all .15s}
        .btn-remove:hover{background:var(--red);color:#fff;border-color:var(--red)}
        .btn-add{background:none;border:1px solid var(--border);color:var(--dim);cursor:pointer;border-radius:3px;font-size:11px;line-height:1;padding:2px 5px;transition:all .15s}
        .btn-add:hover{background:var(--accent);color:#000;border-color:var(--accent)}
        .wl-empty{text-align:center;padding:40px 10px;color:var(--dim);font-size:12px}
        .wl-empty span{font-size:20px;display:block;margin-bottom:8px;opacity:.4}
        .green{color:var(--green)}.red{color:var(--red)}
        .chart-overlay{position:fixed;inset:0;z-index:9999;background:var(--bg);display:none;flex-direction:column}
        .chart-overlay.open{display:flex}
        .chart-topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;min-height:40px;gap:8px}
        .chart-topbar .chart-sym-name{font-size:15px;font-weight:900;color:var(--accent);white-space:nowrap}
        .chart-topbar .chart-info{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--dim);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
        .chart-topbar .chart-info .ci-val{color:var(--text)}
        .chart-tf-btns{display:flex;gap:3px;flex-shrink:0}
        .ctf{padding:3px 7px;font-size:9px;cursor:pointer;border-radius:3px;color:var(--dim);background:transparent;border:1px solid var(--border);font-weight:700;font-family:'JetBrains Mono',monospace;transition:all .15s}
        .ctf.active{color:#000;background:var(--accent);border-color:var(--accent)}
        .ctf:hover:not(.active){color:var(--text);border-color:var(--dim)}
        .chart-close{background:none;border:1px solid var(--border);color:var(--dim);cursor:pointer;font-size:16px;width:30px;height:30px;border-radius:4px;transition:all .15s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .chart-close:hover{background:var(--red);color:#fff;border-color:var(--red)}
        .chart-body{flex:1;position:relative;overflow:hidden;cursor:crosshair}
        .chart-body canvas{display:block;width:100%;height:100%}
        @media(max-width:1100px){.main-grid{flex-direction:column}.table-container.watchlist-panel{flex:none;min-width:0}}
    </style>
</head>
<body>
<div class="header-row">
    <div class="search-box"><input type="text" id="cryptoSearch" placeholder="Search Assets..." oninput="render()"></div>
    <div class="size-control"><span>A-</span><input type="range" min="8" max="18" value="16" id="sizeSlider" oninput="updateSize(this.value)"><span>A+</span></div>
    <div class="status-bar"><div id="scan-status">Initializing...</div><div id="net-status"></div></div>
</div>
<div class="tabs">
    <div class="tab" id="tab-5m" onclick="setRank('5m')">5M</div>
    <div class="tab" id="tab-15m" onclick="setRank('15m')">15M</div>
    <div class="tab" id="tab-1h" onclick="setRank('1h')">1H</div>
    <div class="tab active" id="tab-24h" onclick="setRank('24h')">24H</div>
</div>
<div class="main-grid">
    <div class="table-container">
        <div class="table-title" style="color:var(--green)">LIVE SCREENER <span style="font-size:9px;color:var(--dim);font-weight:500;margin-left:8px">Click symbol for chart · + to watch</span></div>
        <div class="scroll-area"><table><thead><tr>
            <th class="col-rank">#</th><th class="col-sym">Symbol</th><th class="col-price">Price</th>
            <th class="col-pct h-5m" data-tf="5m">5M%</th><th class="col-pct h-15m" data-tf="15m">15M%</th><th class="col-pct h-1h" data-tf="1h">1H%</th><th class="col-pct h-24h" data-tf="24h">24H%</th>
            <th class="col-vol">TF Vol</th><th class="col-vol">24H Vol</th><th class="col-action"></th>
        </tr></thead><tbody id="gainers-body"></tbody></table></div>
    </div>
    <div class="table-container watchlist-panel">
        <div class="table-title" style="color:var(--accent)"><span>&#9733; WATCHLIST</span><span class="wl-count" id="wl-count">0 assets</span></div>
        <div class="scroll-area"><table><thead><tr>
            <th class="col-rank">#</th><th class="wl-sym">Symbol</th><th class="wl-price">Price</th>
            <th class="wl-pct" data-tf="24h">24H%</th><th class="wl-vol">24H Vol</th><th class="wl-action"></th>
        </tr></thead><tbody id="watchlist-body"></tbody></table>
        <div class="wl-empty" id="wl-empty"><span>+</span>Click + on any symbol to start tracking</div></div>
    </div>
</div>
<div class="chart-overlay" id="chartOverlay">
    <div class="chart-topbar">
        <div style="display:flex;align-items:center;gap:6px;min-width:0">
            <span class="chart-sym-name" id="chartSymName">BTC</span>
            <div class="chart-info" id="chartInfo"></div>
        </div>
        <div class="chart-tf-btns" id="chartTfBtns">
            <span class="ctf" data-iv="1m" onclick="changeChartTf('1m')">1m</span>
            <span class="ctf" data-iv="5m" onclick="changeChartTf('5m')">5m</span>
            <span class="ctf" data-iv="15m" onclick="changeChartTf('15m')">15m</span>
            <span class="ctf" data-iv="1h" onclick="changeChartTf('1h')">1h</span>
            <span class="ctf" data-iv="4h" onclick="changeChartTf('4h')">4h</span>
            <span class="ctf" data-iv="1d" onclick="changeChartTf('1d')">1d</span>
        </div>
        <button class="chart-close" onclick="closeChart()">&#10005;</button>
    </div>
    <div class="chart-body" id="chartBody"><canvas id="chartCanvas"></canvas></div>
</div>

<script>
var API_URL="https://fapi.binance.com/fapi/v1",WS_URL="wss://fstream.binance.com/ws";
var pairs={},rankBy='24h',isSyncing=false,watchlist=new Set(),renderPending=false;
var restWeightUsed=0,restWindowStart=Date.now(),restPaused=false,restPauseUntil=0;
var wsAlive=false,mainWs=null,restFallbackTimer=null;
try{JSON.parse(localStorage.getItem('sq_watchlist')||'[]').forEach(function(s){watchlist.add(s)})}catch(e){}
function saveWatchlist(){localStorage.setItem('sq_watchlist',JSON.stringify(Array.from(watchlist)))}
function saveCache(){try{var d={};for(var s in pairs){var p=pairs[s];d[s]={symbol:p.symbol,price:p.price,vol24h:p.vol24h,'24h':p['24h'],'5m':p['5m'],'15m':p['15m'],'1h':p['1h'],v5m:p.v5m,v15m:p.v15m,v1h:p.v1h,o5m:p.o5m,o15m:p.o15m,o1h:p.o1h,sqz:{'5m':p.sqz['5m'],'15m':p.sqz['15m'],'1h':p.sqz['1h'],'1d':p.sqz['1d'],'d50':p.sqz['d50']},_scanned:!!p._scanned}}sessionStorage.setItem('sq_cache',JSON.stringify(d))}catch(e){}}
function loadCache(){try{var r=sessionStorage.getItem('sq_cache');if(!r)return false;var d=JSON.parse(r),c=0;for(var s in d){pairs[s]=d[s];c++}return c>0}catch(e){return false}}

/* ═══ SAFE FETCH ═══ */
async function safeFetch(path,weight){
    while(restPaused){var w=restPauseUntil-Date.now();if(w<=0){restPaused=false;restWeightUsed=0;restWindowStart=Date.now();break}updateNetStatus();await new Promise(function(r){setTimeout(r,Math.min(w,5000))})}
    var att=0;while(att<60){att++;var now=Date.now();if(now-restWindowStart>=60000){restWeightUsed=0;restWindowStart=now}if(restWeightUsed+weight<=2100)break;var sl=60000-(now-restWindowStart)+500;updateNetStatus();await new Promise(function(r){setTimeout(r,Math.min(sl,5000))})}
    restWeightUsed+=weight;updateNetStatus();
    try{var res=await fetch(API_URL+path);try{var hw=res.headers.get('x-mbx-used-weight-1m');if(hw){restWeightUsed=parseInt(hw)||restWeightUsed;restWindowStart=Date.now()}}catch(e){}updateNetStatus();
    if(res.status===429){restPaused=true;restPauseUntil=Date.now()+60000;restWeightUsed=99999;updateNetStatus();return null}return res}
    catch(e){restWeightUsed=Math.max(0,restWeightUsed-weight);updateNetStatus();throw e}}

/* ═══ WEBSOCKET ═══ */
function connectMainWs(){try{mainWs=new WebSocket(WS_URL+'/!miniTicker@arr')}catch(e){wsAlive=false;startRestFallback();return}
mainWs.onopen=function(){wsAlive=true;updateNetStatus()};
mainWs.onmessage=function(ev){try{var msg=JSON.parse(ev.data),tickers=Array.isArray(msg)?msg:[msg];for(var i=0;i<tickers.length;i++){var t=tickers[i];if(!t.s||!t.s.endsWith('USDT'))continue;var sym=t.s,price=parseFloat(t.c),qVol=parseFloat(t.q)||0,open24=parseFloat(t.o)||0;
if(!pairs[sym])pairs[sym]={symbol:sym.replace('USDT',''),price:price,vol24h:qVol,'24h':0,o5m:null,o15m:null,o1h:null,sqz:{'5m':false,'15m':false,'1h':false,'1d':false,'d50':false},v5m:0,v15m:0,v1h:0,'5m':0,'15m':0,'1h':0};
else{pairs[sym].price=price;pairs[sym].vol24h=qVol}if(open24>0)pairs[sym]['24h']=((price-open24)/open24*100);calculatePcts(sym)}scheduleRender()}catch(e){}};
mainWs.onclose=function(){wsAlive=false;updateNetStatus();setTimeout(function(){if(!wsAlive)connectMainWs()},3000)};
mainWs.onerror=function(){wsAlive=false;updateNetStatus();try{mainWs.close()}catch(e){}}}
function startRestFallback(){if(restFallbackTimer)return;updateNetStatus();restFallbackTimer=setInterval(function(){safeFetch('/ticker/24hr',40).then(function(r){if(!r)return;return r.json()}).then(function(d){if(!d||!Array.isArray(d))return;for(var i=0;i<d.length;i++){var t=d[i];if(!t.symbol.endsWith('USDT'))continue;var s=t.symbol;if(!pairs[s])pairs[s]={symbol:s.replace('USDT',''),price:parseFloat(t.lastPrice),vol24h:parseFloat(t.quoteVolume),'24h':parseFloat(t.priceChangePercent),o5m:null,o15m:null,o1h:null,sqz:{'5m':false,'15m':false,'1h':false,'1d':false,'d50':false},v5m:0,v15m:0,v1h:0,'5m':0,'15m':0,'1h':0};else{pairs[s].price=parseFloat(t.lastPrice);pairs[s].vol24h=parseFloat(t.quoteVolume);pairs[s]['24h']=parseFloat(t.priceChangePercent)}calculatePcts(s)}scheduleRender()}).catch(function(){})},10000)}
function scheduleRender(){if(renderPending)return;renderPending=true;requestAnimationFrame(function(){renderPending=false;render()})}
function updateNetStatus(){var el=document.getElementById('net-status');if(!el)return;var wd,ws;if(wsAlive){wd='on';ws='WS LIVE'}else if(restFallbackTimer){wd='warn';ws='REST FALLBACK'}else{wd='off';ws='WS OFF'}var wc='var(--dim)',wt='W:'+restWeightUsed;if(restPaused){wc='var(--red)';var s=Math.ceil((restPauseUntil-Date.now())/1000);wt='429 PAUSED '+s+'s'}else if(restWeightUsed>1800)wc='var(--orange)';el.innerHTML='<span><span class="ns-dot '+wd+'"></span>'+ws+'</span><span style="color:'+wc+'">'+wt+'</span>'}

/* ═══ CHART STATE ═══ */
var currentChartSym=null,chartRAF=null,chartWs=null,chartDirty=true;
var chartCandles=[],chartInterval='5m';
var chartZoom=120,chartOffset=0;
var chartIsDrag=false,chartDragSX=0,chartDragSO=0;
var chartMX=-1,chartMY=-1;
var chartInd={ema9:[],ema21:[],ema50:[],volMA:[],rsi:[]};

function calcEMA(data,per){var e=[],k=2/(per+1);e[0]=data[0];for(var i=1;i<data.length;i++)e[i]=data[i]*k+e[i-1]*(1-k);return e}
function calcSMA(data,per){var s=[];for(var i=0;i<data.length;i++){if(i<per-1){s.push(null);continue}var sum=0;for(var j=i-per+1;j<=i;j++)sum+=data[j];s.push(sum/per)}return s}
function calcRSI(closes,per){var r=[],g=0,l=0;for(var i=0;i<per;i++)r.push(50);for(var i=1;i<=per;i++){var d=closes[i]-closes[i-1];if(d>0)g+=d;else l-=d}var ag=g/per,al=l/per;r[per-1]=al===0?100:100-100/(1+ag/al);for(var i=per;i<closes.length;i++){var d=closes[i]-closes[i-1];ag=(ag*(per-1)+(d>0?d:0))/per;al=(al*(per-1)+(d<0?-d:0))/per;r[i]=al===0?100:100-100/(1+ag/al)}return r}
function recalcInd(){if(chartCandles.length<2)return;var cl=chartCandles.map(function(c){return c.c}),vl=chartCandles.map(function(c){return c.v});chartInd.ema9=calcEMA(cl,9);chartInd.ema21=calcEMA(cl,21);chartInd.ema50=calcEMA(cl,50);chartInd.volMA=calcSMA(vl,20);chartInd.rsi=calcRSI(cl,14);chartDirty=true}

async function openChart(sym){currentChartSym=sym;document.getElementById('chartSymName').innerText=sym;document.getElementById('chartInfo').innerHTML='<span style="color:var(--dim)">Loading...</span>';document.getElementById('chartOverlay').classList.add('open');document.body.classList.add('modal-open');chartMX=-1;chartMY=-1;chartCandles=[];chartZoom=120;chartOffset=0;chartInterval=rankBy==='5m'?'5m':rankBy==='15m'?'15m':rankBy==='1h'?'1h':'1d';updateTfBtns();await loadChartRest(sym);connectChartWs(sym);startChartLoop()}
async function loadChartRest(sym){try{var res=await safeFetch('/klines?symbol='+sym+'USDT&interval='+chartInterval+'&limit=300',5);if(!res)return;var d=await res.json();if(Array.isArray(d)){chartCandles=d.map(function(k){return{t:parseInt(k[0]),o:parseFloat(k[1]),h:parseFloat(k[2]),l:parseFloat(k[3]),c:parseFloat(k[4]),v:parseFloat(k[5])}});recalcInd()}updateChartInfo();chartDirty=true}catch(e){}}
function connectChartWs(sym){if(chartWs){try{chartWs.close()}catch(e){}chartWs=null}try{chartWs=new WebSocket(WS_URL+'/'+sym.toLowerCase()+'usdt@kline_'+chartInterval)}catch(e){return}chartWs.onmessage=function(ev){try{var k=JSON.parse(ev.data).k;if(!k)return;var cd={t:parseInt(k.t),o:parseFloat(k.o),h:parseFloat(k.h),l:parseFloat(k.l),c:parseFloat(k.c),v:parseFloat(k.v)};var last=chartCandles.length?chartCandles[chartCandles.length-1]:null;if(last&&last.t===cd.t){last.h=cd.h;last.l=cd.l;last.c=cd.c;last.v=cd.v}else{chartCandles.push(cd);if(chartCandles.length>500)chartCandles.shift()}recalcInd();updateChartInfo()}catch(e){}}}
function changeChartTf(iv){chartInterval=iv;chartCandles=[];chartZoom=120;chartOffset=0;chartInd={ema9:[],ema21:[],ema50:[],volMA:[],rsi:[]};updateTfBtns();if(currentChartSym){loadChartRest(currentChartSym);connectChartWs(currentChartSym)}}
function updateTfBtns(){var btns=document.querySelectorAll('.ctf');for(var i=0;i<btns.length;i++){if(btns[i].dataset.iv===chartInterval)btns[i].classList.add('active');else btns[i].classList.remove('active')}}
function updateChartInfo(){if(!chartCandles.length)return;var last=chartCandles[chartCandles.length-1],prev=chartCandles.length>1?chartCandles[chartCandles.length-2]:last;var ch=last.c-prev.c,cp=prev.c?(ch/prev.c*100):0,col=ch>=0?'var(--green)':'var(--red)',ar=ch>=0?'&#9650;':'&#9660;';var fp=function(v){return v<1?v.toFixed(5):v<100?v.toFixed(3):v.toLocaleString()};var fv=last.v>=1e9?(last.v/1e9).toFixed(2)+'B':last.v>=1e6?(last.v/1e6).toFixed(2)+'M':last.v>=1e3?(last.v/1e3).toFixed(1)+'K':Math.round(last.v);document.getElementById('chartInfo').innerHTML='<span>O <span class="ci-val">'+fp(last.o)+'</span></span><span>H <span class="ci-val">'+fp(last.h)+'</span></span><span>L <span class="ci-val">'+fp(last.l)+'</span></span><span>C <span class="ci-val" style="color:'+col+'">'+fp(last.c)+'</span></span><span>Vol <span class="ci-val">'+fv+'</span></span><span style="color:'+col+'">'+ar+' '+Math.abs(cp).toFixed(2)+'%</span>'}

function drawChart(){
    var canvas=document.getElementById('chartCanvas'),container=document.getElementById('chartBody');
    var dpr=window.devicePixelRatio||1,w=container.clientWidth,h=container.clientHeight;
    if(w<10||h<10)return;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+'px';canvas.style.height=h+'px';
    var ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
    var BG='#0b0e11',GRID='#1a1d23',TEXT='#848e9c',GREEN='#0ecb81',RED='#f6465d',UP_BG='rgba(14,203,129,0.15)',DN_BG='rgba(246,70,93,0.15)';
    var EMA9C='#fcd535',EMA21C='#00d4aa',EMA50C='#ff78f8',RSIC='#3d7eff',VMAC='#f0b90b';
    ctx.fillStyle=BG;ctx.fillRect(0,0,w,h);
    if(!chartCandles.length){ctx.fillStyle=TEXT;ctx.font='13px Inter';ctx.textAlign='center';ctx.fillText('No data',w/2,h/2);return}

    var PR=68,PB=22,PT=6,GAP=3;
    var chartW=w-PR,totalH=h-PT-PB;

    var startIdx=Math.max(0,endIdx-chartZoom+1);
    var vc=Math.min(chartZoom,endIdx-startIdx+1);
    if(vc<1)vc=1;
    var sl=chartCandles.slice(startIdx,startIdx+vc);
    var cW=chartW/vc,bW=Math.max(1,cW*0.65),wkW=Math.max(1,cW<5?1:1.5);

    /* Price range */
    var mnP=Infinity,mxP=-Infinity,mxV=0;
    for(var i=0;i<sl.length;i++){if(sl[i].l<mnP)mnP=sl[i].l;if(sl[i].h>mxP)mxP=sl[i].h;if(sl[i].v>mxV)mxV=sl[i].v}
    /* Include nearby EMAs in range */

    var pR=mxP-mnP;if(pR===0)pR=mxP*0.01||1;mnP-=pR*0.05;mxP+=pR*0.05;pR=mxP-mnP;
    function pY(p){return PT+priceH-((p-mnP)/pR)*priceH}
    function fpa(p){return p<1?p.toFixed(5):p<100?p.toFixed(3):p<10000?p.toFixed(1):p.toLocaleString()}

    /* Price grid + labels */
    ctx.strokeStyle=GRID;ctx.lineWidth=0.5;ctx.fillStyle=TEXT;ctx.font='9px JetBrains Mono';ctx.textAlign='left';
    for(var g=0;g<=6;g++){var gp=mnP+(pR/6)*g,gy=pY(gp);ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(chartW,gy);ctx.stroke();ctx.fillText(fpa(gp),chartW+4,gy+3)}

    /* Time labels */
    var iv=chartInterval,le=Math.max(1,Math.floor(vc/8));ctx.textAlign='center';
    for(var t=0;t<sl.length;t+=le){var tx=t*cW+cW/2,d=new Date(sl[t].t),lb;if(iv==='1d')lb=(d.getMonth()+1)+'/'+d.getDate();else if(iv==='1h'||iv==='4h')lb=d.getHours()+':00';else lb=d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();ctx.fillText(lb,tx,h-6);ctx.beginPath();ctx.moveTo(tx,PT);ctx.lineTo(tx,rsiTop+rsiH);ctx.stroke()}

    /* Volume area separator */
    ctx.strokeStyle=GRID;ctx.beginPath();ctx.moveTo(0,volTop-GAP/2);ctx.lineTo(chartW,volTop-GAP/2);ctx.stroke();
    /* RSI area separator */
    ctx.beginPath();ctx.moveTo(0,rsiTop-GAP/2);ctx.lineTo(chartW,rsiTop-GAP/2);ctx.stroke();
    /* RSI bottom */
    ctx.beginPath();ctx.moveTo(0,rsiTop+rsiH);ctx.lineTo(chartW,rsiTop+rsiH);ctx.stroke();

    /* RSI levels */
    ctx.font='8px JetBrains Mono';ctx.textAlign='left';
    function rsiY(v){return rsiTop+rsiH-(v/100)*rsiH}
    ctx.strokeStyle='rgba(246,70,93,0.3)';ctx.setLineDash([3,3]);ctx.beginPath();ctx.moveTo(0,rsiY(70));ctx.lineTo(chartW,rsiY(70));ctx.stroke();
    ctx.strokeStyle='rgba(14,203,129,0.3)';ctx.beginPath();ctx.moveTo(0,rsiY(30));ctx.lineTo(chartW,rsiY(30));ctx.stroke();
    ctx.strokeStyle='rgba(132,142,156,0.2)';ctx.beginPath();ctx.moveTo(0,rsiY(50));ctx.lineTo(chartW,rsiY(50));ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle='#848e9c';ctx.fillText('70',chartW+4,rsiY(70)+3);ctx.fillText('30',chartW+4,rsiY(30)+3);ctx.fillText('50',chartW+4,rsiY(50)+3);
    /* RSI fill zones */
    ctx.fillStyle='rgba(246,70,93,0.04)';ctx.fillRect(0,rsiY(100),chartW,rsiY(70)-rsiY(100));
    ctx.fillStyle='rgba(14,203,129,0.04)';ctx.fillRect(0,rsiY(30),chartW,rsiY(0)-rsiY(30));

    /* Volume bars + Vol MA */
    for(var c=0;c<sl.length;c++){var cd=sl[c],cx=c*cW+cW/2,isUp=cd.c>=cd.o;var vTop2=volTop,vBH=mxV>0?(cd.v/mxV)*volH:0;ctx.fillStyle=isUp?UP_BG:DN_BG;ctx.fillRect(cx-bW/2,vTop2+volH-vBH,bW,vBH)}
    /* Vol MA line */
    ctx.strokeStyle=VMAC;ctx.lineWidth=1;ctx.beginPath();var vmaStarted=false;
    for(var c=0;c<sl.length;c++){var gi=startIdx+c,vm=chartInd.volMA[gi];if(vm==null)continue;var vx=c*cW+cW/2,vy=volTop+volH-(vm/(mxV||1))*volH;vy=Math.max(volTop,Math.min(volTop+volH,vy));if(!vmaStarted){ctx.moveTo(vx,vy);vmaStarted=true}else ctx.lineTo(vx,vy)}
    ctx.stroke();

    /* EMA lines */
    function drawEMA(arr,col){ctx.strokeStyle=col;ctx.lineWidth=1.2;ctx.beginPath();var started=false;for(var c=0;c<sl.length;c++){var gi=startIdx+c,v=arr[gi];if(v==null)continue;var ex=c*cW+cW/2,ey=pY(v);if(!started){ctx.moveTo(ex,ey);started=true}else ctx.lineTo(ex,ey)}ctx.stroke()}
    drawEMA(chartInd.ema50,EMA50C);
    drawEMA(chartInd.ema21,EMA21C);
    drawEMA(chartInd.ema9,EMA9C);

    /* Candles */
    for(var c=0;c<sl.length;c++){var cd=sl[c],cx=c*cW+cW/2,isUp=cd.c>=cd.o,col=isUp?GREEN:RED;ctx.strokeStyle=col;ctx.lineWidth=wkW;ctx.beginPath();ctx.moveTo(cx,pY(cd.h));ctx.lineTo(cx,pY(cd.l));ctx.stroke();var yt=pY(Math.max(cd.o,cd.c)),yb=pY(Math.min(cd.o,cd.c)),bh=Math.max(1,yb-yt);ctx.fillStyle=col;ctx.fillRect(cx-bW/2,yt,bW,bh)}

    /* RSI line */
    if(chartInd.rsi.length>startIdx+sl.length-1){ctx.strokeStyle=RSIC;ctx.lineWidth=1.2;ctx.beginPath();var rStarted=false;for(var c=0;c<sl.length;c++){var gi=startIdx+c,rv=chartInd.rsi[gi];if(rv==null)continue;var rx=c*cW+cW/2,ry=rsiY(rv);if(!rStarted){ctx.moveTo(rx,ry);rStarted=true}else ctx.lineTo(rx,ry)}ctx.stroke()}

    /* Current price line */
    var lc=sl[sl.length-1],lY=pY(lc.c),lCol=lc.c>=lc.o?GREEN:RED;
    ctx.strokeStyle=lCol;ctx.lineWidth=1;ctx.setLineDash([4,3]);ctx.beginPath();ctx.moveTo(0,lY);ctx.lineTo(chartW,lY);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=lCol;ctx.fillRect(chartW,lY-9,PR,18);ctx.fillStyle=lc.c>=lc.o?'#000':'#fff';ctx.font='bold 9px JetBrains Mono';ctx.textAlign='left';ctx.fillText(fpa(lc.c),chartW+4,lY+3);

    ctx.font='bold 9px JetBrains Mono';ctx.textAlign='left';
    var legY=PT+14,legX=6;
    function legLine(col,label,val){ctx.fillStyle=col;ctx.fillRect(legX,legY-5,14,2);ctx.fillStyle=TEXT;ctx.fillText(label+': '+fpa(val),legX+18,legY);legY+=13}
    var lgi=startIdx+sl.length-1;
    if(chartInd.ema9[lgi]!=null)legLine(EMA9C,'EMA9',chartInd.ema9[lgi]);
    if(chartInd.ema21[lgi]!=null)legLine(EMA21C,'EMA21',chartInd.ema21[lgi]);
    if(chartInd.ema50[lgi]!=null)legLine(EMA50C,'EMA50',chartInd.ema50[lgi]);
    if(chartInd.rsi[lgi]!=null){ctx.fillStyle=RSIC;ctx.fillRect(legX,legY-5,14,2);ctx.fillStyle=TEXT;ctx.fillText('RSI:'+chartInd.rsi[lgi].toFixed(1),legX+18,legY)}

    if(chartMX>=0&&chartMX<chartW&&chartMY>=PT&&chartMY<rsiTop+rsiH){
        ctx.strokeStyle='rgba(234,236,239,0.18)';ctx.lineWidth=0.5;ctx.setLineDash([3,3]);
        ctx.beginPath();ctx.moveTo(chartMX,PT);ctx.lineTo(chartMX,rsiTop+rsiH);ctx.stroke();
        ctx.beginPath();ctx.moveTo(0,chartMY);ctx.lineTo(chartW,chartMY);ctx.stroke();ctx.setLineDash([]);

        /* Price Y label */
        if(chartMY>=PT&&chartMY<=PT+priceH){var hp=mnP+(1-(chartMY-PT)/priceH)*pR;ctx.fillStyle='#2b3139';ctx.fillRect(chartW,chartMY-9,PR,18);ctx.fillStyle='#eaecef';ctx.font='9px JetBrains Mono';ctx.textAlign='left';ctx.fillText(fpa(hp),chartW+4,chartMY+3)}

    }
}

async function syncMissingOpens(symbols){
    if(isSyncing)return;isSyncing=true;
    /* PRIORITY: watchlist first, then by volume descending */
    var wlSet=new Set(Array.from(watchlist).map(function(s){return s+'USDT'}));
    symbols.sort(function(a,b){var aw=wlSet.has(a)?1:0,bw=wlSet.has(b)?1:0;if(aw!==bw)return bw-aw;return(pairs[b]?pairs[b].vol24h:0)-(pairs[a]?pairs[a].vol24h:0)});

    for(var i=0;i<total;i++){var sym=symbols[i];if(pairs[sym]&&pairs[sym]._scanned){done++;continue}
    var results=[],failed=false,intervals=['5m','15m','1h','1d'];
    for(var ti=0;ti<intervals.length;ti++){if(restPaused){failed=true;break}try{var lim=intervals[ti]==='1d'?70:25;var res=await safeFetch('/klines?symbol='+sym+'&interval='+intervals[ti]+'&limit='+lim,5);if(!res){failed=true;break}results.push(await res.json())}catch(e){failed=true;break}}

    var checkSq=function(data,per,fc){if(!data||data.length<(per+fc))return false;for(var j=0;j<5;j++){var seg=data.slice(data.length-(per+j),data.length-j);if(seg.length<per)break;var hh=[];for(var f=1;f<=fc;f++){var fs=data.slice(data.length-(per+j+f),data.length-j-f);hh.push(Math.max.apply(null,fs.map(function(c){return parseFloat(c[2])})))}if(hh.every(function(h){return h===hh[0]})&&pairs[sym].price>hh[0])return true}return false};

    if(k15&&k15.length){pairs[sym].o15m=parseFloat(k15[k15.length-1][1]);pairs[sym].v15m=parseFloat(k15[k15.length-1][7]);pairs[sym].sqz['15m']=checkSq(k15,10,5)}
    if(k1&&k1.length){pairs[sym].o1h=parseFloat(k1[k1.length-1][1]);pairs[sym].v1h=parseFloat(k1[k1.length-1][7]);pairs[sym].sqz['1h']=checkSq(k1,10,5)}

    saveCache();document.getElementById('scan-status').innerText="LIVE: SQUEEZE ENGINE READY";isSyncing=false;render()}

    document.getElementById('gainers-body').innerHTML=mh;
    var ws=Array.from(watchlist),wd=ws.map(function(s){return pairs[s+'USDT']}).filter(Boolean);wd.sort(function(a,b){return(b['24h']||-999)-(a['24h']||-999)});
    document.getElementById('wl-count').innerText=wd.length+' asset'+(wd.length!==1?'s':'');document.getElementById('wl-empty').style.display=wd.length===0?'block':'none';
    var wh='';for(var j=0;j<wd.length;j++){var wp=wd[j],wbd=buildBadges(wp,ld,tfs),wps=wp.price<1?'$'+wp.price.toFixed(5):'$'+wp.price.toLocaleString();
    wh+='<tr class="'+(wbd.isGolden?'golden-zone':'')+'"><td class="col-rank">'+(j+1)+'</td><td class="wl-sym" onclick="openChart(\''+wp.symbol+'\')">'+wp.symbol+wbd.badges+'</td><td class="wl-price">'+wps+'</td><td class="wl-pct '+(wp['24h']>=0?'green':'red')+' '+(rankBy==='24h'?'active-col':'')+'">'+(wp['24h']||0).toFixed(2)+'%</td><td class="wl-vol">'+formatVol(wp.vol24h)+'</td><td class="wl-action"><button class="btn-remove" onclick="event.stopPropagation();toggleWatch(\''+wp.symbol+'\')">&#10005;</button></td></tr>'}
    document.getElementById('watchlist-body').innerHTML=wh}

/* ═══ BOOTSTRAP ═══ */
updateSize(16);var hadCache=loadCache();if(hadCache){render();document.getElementById('scan-status').innerText="RESTORED — Connecting..."}
connectMainWs();initialLoad();
setInterval(function(){refreshOpens('5m')},300000);
setInterval(function(){refreshOpens('15m')},900000);
setInterval(function(){refreshOpens('1h')},3600000);
setInterval(function(){if(isSyncing||watchlist.size===0)return;var wl=Array.from(watchlist).map(function(s){return s+'USDT'}).filter(function(s){return pairs[s]});wl.forEach(function(s){if(pairs[s])pairs[s]._scanned=false});syncMissingOpens(wl)},300000);
setInterval(saveCache,15000);setInterval(updateNetStatus,2000);updateNetStatus();
</script>
