<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuantPulse v4.5 | No Limit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap');
        :root { --bg: #030508; --accent: #f3ba2f; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: #f0f2f5; min-height: 100vh; }
        .glass { background: rgba(20, 24, 30, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 16px; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .tf-btn.active { background: var(--accent); color: #000; box-shadow: 0 0 25px rgba(243, 186, 47, 0.25); }
        .adaptive-grid { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
        .breakout-card { border: 1px solid #10b981; background: linear-gradient(135deg, rgba(16, 185, 129, 0.15) 0%, transparent 100%); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="p-4 md:p-6">

    <div class="max-w-[1600px] mx-auto">
        <header class="flex flex-col xl:flex-row justify-between items-start xl:items-center mb-6 gap-6">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tighter italic text-white uppercase">UNLIMITED<span class="text-[var(--accent)] not-italic">SCAN</span></h1>
                <div class="flex flex-wrap gap-2 mt-2">
                    <span id="market-load" class="text-[9px] mono text-blue-400 font-bold bg-blue-500/10 px-2 py-1 rounded border border-blue-500/20 uppercase tracking-widest italic">Full Market Coverage</span>
                    <span id="sync-status" class="text-[9px] mono text-gray-500 font-bold bg-white/5 px-2 py-1 rounded border border-white/10 uppercase tracking-widest italic">Syncing...</span>
                </div>
            </div>

            <div class="flex flex-col md:flex-row items-center gap-3 w-full xl:w-auto">
                <div class="glass p-1 flex gap-1 overflow-x-auto no-scrollbar w-full md:w-auto">
                    <button onclick="updateTF('5m')" id="btn-5m" class="tf-btn px-4 py-2 rounded-xl text-[10px] font-black bg-white/5 uppercase">5M</button>
                    <button onclick="updateTF('15m')" id="btn-15m" class="tf-btn px-4 py-2 rounded-xl text-[10px] font-black bg-white/5 uppercase">15M</button>
                    <button onclick="updateTF('1h')" id="btn-1h" class="tf-btn px-4 py-2 rounded-xl text-[10px] font-black bg-white/5 uppercase">1H</button>
                    <button onclick="updateTF('4h')" id="btn-4h" class="tf-btn px-4 py-2 rounded-xl text-[10px] font-black bg-white/5 uppercase active">4H</button>
                    <button onclick="updateTF('1d')" id="btn-1d" class="tf-btn px-4 py-2 rounded-xl text-[10px] font-black bg-white/5 uppercase">24H</button>
                </div>
                <div class="glass px-4 py-2 flex items-center justify-between gap-4 w-full md:w-auto">
                    <span class="text-[9px] font-black text-gray-400 uppercase tracking-widest">Show Only Breakouts</span>
                    <input type="checkbox" id="breakout-toggle" class="sr-only peer" onchange="runScreener()">
                    <label for="breakout-toggle" class="relative w-10 h-5 bg-white/10 rounded-full peer peer-checked:bg-emerald-500 transition-all after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:after:translate-x-5 cursor-pointer"></label>
                </div>
            </div>
        </header>

        <div id="screener-list" class="adaptive-grid"></div>
    </div>

    <script>
        const API_BASE = "https://fapi.binance.com/fapi/v1";
        let activeTF = '4h';
        let customSymbols = [];

        async function updateTF(tf) {
            activeTF = tf;
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${tf}`).classList.add('active');
            runScreener();
        }

        function formatVol(v) {
            if (v >= 1e9) return (v/1e9).toFixed(1) + 'B';
            if (v >= 1e6) return (v/1e6).toFixed(1) + 'M';
            return (v/1e3).toFixed(0) + 'K';
        }

        async function fetchSymbolData(symbol, tf) {
            try {
                const res = await fetch(`${API_BASE}/klines?symbol=${symbol}&interval=${tf}&limit=11`);
                const k = await res.json();
                const prev = k.slice(0, 10);
                const current = k[10];
                const high = Math.max(...prev.map(c => parseFloat(c[2])));
                const price = parseFloat(current[4]);
                const open = parseFloat(current[1]);
                return { s: symbol.replace('USDT',''), p: price, h: high, pct: ((price - open) / open) * 100, vol: parseFloat(current[7]), isBrk: price > high };
            } catch (e) { return null; }
        }

        async function runScreener() {
            const showOnly = document.getElementById('breakout-toggle').checked;
            try {
                const res = await fetch(`${API_BASE}/ticker/24hr`);
                const all = await res.json();
                
                // NO VOLUME LIMIT: Filters only for USDT pairs
                // Shows the top 80 most volatile assets (Gains or Losers)
                let targets = customSymbols.length > 0 ? customSymbols : 
                    all.filter(t => t.symbol.endsWith('USDT'))
                       .sort((a,b) => Math.abs(parseFloat(b.priceChangePercent)) - Math.abs(parseFloat(a.priceChangePercent)))
                       .slice(0, 80).map(t => t.symbol);

                document.getElementById('market-load').innerText = `TOTAL PAIRS: ${targets.length}`;

                // Parallel fetching with a slight delay for large batches to prevent rate limiting
                let data = await Promise.all(targets.map(s => fetchSymbolData(s, activeTF)));
                data = data.filter(d => d !== null);
                
                if (showOnly) data = data.filter(d => d.isBrk);

                const list = document.getElementById('screener-list');
                list.innerHTML = data.sort((a,b) => b.pct - a.pct).map(coin => `
                    <div class="glass p-4 flex flex-col justify-between min-h-[130px] border-l-2 transition-all ${coin.isBrk ? 'breakout-card border-l-emerald-500 scale-[1.01]' : 'border-l-transparent opacity-80'}">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="text-lg font-black text-white italic tracking-tighter">${coin.s}</h3>
                                <div class="text-[9px] mono text-gray-500 mt-1">VOL: <span class="text-[var(--accent)] font-bold">$${formatVol(coin.vol)}</span></div>
                            </div>
                            <div class="text-right">
                                <div class="text-sm font-black text-white mono">$${coin.p < 1 ? coin.p.toFixed(5) : coin.p.toLocaleString()}</div>
                                <div class="text-[10px] font-black mono ${coin.pct >= 0 ? 'text-emerald-400' : 'text-red-500'}">
                                    ${coin.pct >= 0 ? '▲' : '▼'}${Math.abs(coin.pct).toFixed(2)}%
                                </div>
                            </div>
                        </div>
                        <div class="mt-3 pt-3 border-t border-white/5 flex justify-between items-center">
                             <div class="text-[8px] mono text-gray-500 font-bold uppercase tracking-widest">
                                10P High: <span class="text-gray-300 font-black">$${coin.h < 1 ? coin.h.toFixed(5) : coin.h.toLocaleString()}</span>
                            </div>
                            ${coin.isBrk ? '<span class="text-[7px] bg-emerald-500 text-black px-1.5 py-0.5 rounded font-black uppercase">BREAKOUT</span>' : ''}
                        </div>
                    </div>
                `).join('');
                document.getElementById('sync-status').innerText = `SYNCED: ${new Date().toLocaleTimeString()}`;
            } catch (e) { console.error(e); }
        }

        updateTF('4h');
        setInterval(runScreener, 20000);
    </script>
</body>
</html>
