<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuantPulse | Coinglass Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --bg: #0c0e12;
            --surface: #161a1e;
            --border: #2b3139;
            --text-dim: #848e9c;
            --up: #02c076;
            --down: #f84960;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--bg); 
            color: #eaecef;
            margin: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* Scaling Logic */
        body.sz-sm { --base-fs: 12px; --coin-fs: 13px; }
        body.sz-md { --base-fs: 14px; --coin-fs: 15px; }
        body.sz-lg { --base-fs: 17px; --coin-fs: 18px; }

        .glass-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
        }

        .btn-pill {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-dim);
            border-radius: 4px;
            transition: all 0.2s;
        }

        .btn-pill.active {
            background: #2b3139;
            color: white;
        }

        .market-table { width: 100%; border-collapse: collapse; }
        .market-table th {
            text-align: right;
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 500;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }
        .market-table th:first-child, .market-table th:nth-child(2) { text-align: left; }
        
        .market-table td {
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.02);
            font-size: var(--base-fs);
            font-variant-numeric: tabular-nums;
        }

        .coin-name { font-size: var(--coin-fs); font-weight: 600; color: #fff; }
        .row-brk { background: linear-gradient(90deg, rgba(2, 192, 118, 0.03) 0%, transparent 100%); }
        
        .coin-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #2b3139;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="sz-md pb-20">

    <div class="max-w-[1600px] mx-auto px-4 py-6">
        
        <div class="flex flex-wrap items-center gap-3 mb-8">
            <div class="flex bg-[#161a1e] p-1 rounded">
                <button onclick="updateTF('5m')" id="btn-5m" class="btn-pill">5 minute</button>
                <button onclick="updateTF('15m')" id="btn-15m" class="btn-pill active">15 minute</button>
                <button onclick="updateTF('1h')" id="btn-1h" class="btn-pill">1 hour</button>
                <button onclick="updateTF('4h')" id="btn-4h" class="btn-pill">4 hour</button>
                <button onclick="updateTF('1d')" id="btn-1d" class="btn-pill">24 hour</button>
            </div>

            <div class="flex bg-[#161a1e] p-1 rounded">
                <button onclick="setScale('sm')" id="sc-sm" class="btn-pill">A</button>
                <button onclick="setScale('md')" id="sc-md" class="btn-pill active">A+</button>
                <button onclick="setScale('lg')" id="sc-lg" class="btn-pill">A++</button>
            </div>

            <button onclick="toggleBrk()" id="brk-btn" class="bg-[#161a1e] px-4 py-2 text-[11px] font-bold uppercase rounded border border-white/5">
                Breakouts: <span id="brk-status" class="text-gray-500">OFF</span>
            </button>
        </div>

        <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
            
            <div class="glass-panel overflow-hidden">
                <table class="market-table">
                    <thead>
                        <tr>
                            <th class="w-12">#</th>
                            <th>Symbol</th>
                            <th>Price</th>
                            <th id="h-gain">Price Change (15m)</th>
                            <th>Volume (24h)</th>
                        </tr>
                    </thead>
                    <tbody id="list-gainers"></tbody>
                </table>
            </div>

            <div class="glass-panel overflow-hidden">
                <table class="market-table">
                    <thead>
                        <tr>
                            <th class="w-12">#</th>
                            <th>Symbol</th>
                            <th>Price</th>
                            <th id="h-lose">Price Change (15m)</th>
                            <th>Volume (24h)</th>
                        </tr>
                    </thead>
                    <tbody id="list-losers"></tbody>
                </table>
            </div>

        </div>
    </div>

    <script>
        const API = "https://fapi.binance.com/fapi/v1";
        let activeTF = '15m';
        let filterBrk = false;

        function setScale(s) {
            document.body.classList.remove('sz-sm', 'sz-md', 'sz-lg');
            document.body.classList.add(`sz-${s}`);
            document.querySelectorAll('[id^="sc-"]').forEach(b => b.classList.remove('active'));
            document.getElementById(`sc-${s}`).classList.add('active');
        }

        function toggleBrk() {
            filterBrk = !filterBrk;
            document.getElementById('brk-status').innerText = filterBrk ? 'ON' : 'OFF';
            document.getElementById('brk-status').className = filterBrk ? 'text-emerald-400' : 'text-gray-500';
            runScreener();
        }

        async function updateTF(tf) {
            activeTF = tf;
            document.querySelectorAll('[id^="btn-"]').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${tf}`).classList.add('active');
            const label = tf.replace('m',' minute').replace('h',' hour').replace('d',' hour');
            document.getElementById('h-gain').innerText = `Price Change (${tf})`;
            document.getElementById('h-lose').innerText = `Price Change (${tf})`;
            runScreener();
        }

        function formatUSD(v) {
            if (v >= 1e9) return '$' + (v/1e9).toFixed(2) + 'B';
            if (v >= 1e6) return '$' + (v/1e6).toFixed(2) + 'M';
            return '$' + (v/1e3).toFixed(2) + 'K';
        }

        async function fetchPair(s) {
            try {
                const [kR, tR] = await Promise.all([
                    fetch(`${API}/klines?symbol=${s}&interval=${activeTF}&limit=11`),
                    fetch(`${API}/ticker/24hr?symbol=${s}`)
                ]);
                const k = await kR.json(), t = await tR.json();
                const cur = k[10], p10 = k.slice(0,10);
                const high = Math.max(...p10.map(c => parseFloat(c[2])));
                const price = parseFloat(cur[4]), open = parseFloat(cur[1]);
                return { s: s.replace('USDT',''), p: price, pct: ((price-open)/open)*100, v24: parseFloat(t.quoteVolume), isB: price > high };
            } catch(e) { return null; }
        }

        async function runScreener() {
            try {
                const res = await fetch(`${API}/ticker/24hr`);
                const all = await res.json();
                let targets = all.filter(t => t.symbol.endsWith('USDT'))
                                 .sort((a,b) => Math.abs(parseFloat(b.priceChangePercent)) - Math.abs(parseFloat(a.priceChangePercent)))
                                 .slice(0, 40).map(t => t.symbol);

                let data = (await Promise.all(targets.map(fetchPair))).filter(d => d);
                let g = [...data].sort((a,b) => b.pct - a.pct);
                let l = [...data].sort((a,b) => a.pct - b.pct);

                if (filterBrk) { g = g.filter(d => d.isB); l = l.filter(d => d.isB); }

                const row = (c, i) => `
                    <tr class="${c.isB ? 'row-brk' : ''}">
                        <td class="text-[#474d57]">${i+1}</td>
                        <td>
                            <div class="flex items-center gap-3">
                                <img src="https://bin.bnbstatic.com/static/assets/logos/${c.s}.png" 
                                     onerror="this.src='https://bin.bnbstatic.com/static/images/common/placeholder.png'" 
                                     class="coin-icon">
                                <span class="coin-name">${c.s}</span>
                            </div>
                        </td>
                        <td class="text-right font-medium">$${c.p < 0.1 ? c.p.toFixed(6) : c.p.toLocaleString()}</td>
                        <td class="text-right font-medium ${c.pct >= 0 ? 'text-[#02c076]' : 'text-[#f84960]'}">
                            ${c.pct >= 0 ? '+' : ''}${c.pct.toFixed(2)}%
                        </td>
                        <td class="text-right font-medium text-white">${formatUSD(c.v24)}</td>
                    </tr>`;

                document.getElementById('list-gainers').innerHTML = g.slice(0, 12).map(row).join('');
                document.getElementById('list-losers').innerHTML = l.slice(0, 12).map(row).join('');
            } catch(e) {}
        }

        updateTF('15m');
        setInterval(runScreener, 30000);
    </script>
</body>
</html>
