<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Multi-Timeframe Screener</title>
    <style>
        :root {
            --bg: #0b0e11; --card: #181a20; --border: #2b3139;
            --text: #eaecef; --dim: #848e9c; --green: #0ecb81;
            --red: #f6465d; --accent: #fcd535;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 10px; }
        .dashboard { width: 100%; max-width: 1100px; margin: auto; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
        
        .scanner-info { padding: 12px 15px; background: #1e2026; border-bottom: 1px solid var(--border); }
        .progress-box { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 5px; color: var(--dim); }
        .progress-bar { height: 4px; background: #2b3139; border-radius: 2px; }
        #progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.3s; }

        .tabs-container { background: #181a20; padding: 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
        .tab { padding: 6px 14px; font-size: 12px; cursor: pointer; border-radius: 4px; color: var(--dim); background: #2b3139; white-space: nowrap; transition: 0.2s; }
        .tab.active { color: #000; background: var(--accent); font-weight: bold; }

        .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        
        th { text-align: right; padding: 12px 15px; color: var(--dim); font-size: 11px; text-transform: uppercase; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--card); }
        th:nth-child(1), td:nth-child(1) { text-align: left; width: 30px; padding-left: 15px; }
        th:nth-child(2), td:nth-child(2) { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 10; border-right: 1px solid var(--border); }

        td { padding: 12px 15px; text-align: right; border-bottom: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        .symbol-name { font-weight: 700; color: #fff; }
        .green { color: var(--green); }
        .red { color: var(--red); }
        .price-badge { background: #2b3139; padding: 2px 5px; border-radius: 4px; color: var(--text); }
        .active-rank-col { background: rgba(252, 213, 53, 0.05); }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="scanner-info">
        <div class="progress-box">
            <span id="scan-status">Syncing Market Data...</span>
            <span id="scan-pct">0%</span>
        </div>
        <div class="progress-bar"><div id="progress-fill"></div></div>
    </div>

    <div class="tabs-container">
        <span style="font-size: 11px; color: var(--dim)">RANK BY:</span>
        <div class="tab" onclick="setRank('5m', this)">5M</div>
        <div class="tab" onclick="setRank('15m', this)">15M</div>
        <div class="tab" onclick="setRank('1h', this)">1H</div>
        <div class="tab active" onclick="setRank('24h', this)">24H</div>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Symbol</th>
                    <th>Price</th>
                    <th>5M</th>
                    <th>15M</th>
                    <th>1H</th>
                    <th>24H</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
</div>

<script>
    const API = "https://fapi.binance.com/fapi/v1";
    let pairsData = JSON.parse(localStorage.getItem('pro_screener_data')) || [];
    let rankBy = localStorage.getItem('pro_screener_rank') || '24h';
    let scanIdx = parseInt(localStorage.getItem('pro_screener_idx')) || 0;

    // Initial Load
    renderTable();
    updateTabUI();

    async function getChange(symbol, interval) {
        try {
            const res = await fetch(`${API}/klines?symbol=${symbol}&interval=${interval}&limit=2`);
            const data = await res.json();
            const open = parseFloat(data[0][1]);
            const close = parseFloat(data[data.length - 1][4]);
            return ((close - open) / open * 100).toFixed(2);
        } catch (e) { return "0.00"; }
    }

    async function startScanner() {
        try {
            const res = await fetch(`${API}/ticker/24hr`);
            const tickers = (await res.json()).filter(t => t.symbol.endsWith('USDT'));
            
            while (true) {
                if (scanIdx >= tickers.length) scanIdx = 0;
                
                const t = tickers[scanIdx];
                document.getElementById('scan-status').innerText = `Scanning: ${t.symbol}`;
                let pct = Math.round(((scanIdx + 1) / tickers.length) * 100);
                document.getElementById('scan-pct').innerText = pct + "%";
                document.getElementById('progress-fill').style.width = pct + "%";

                const [m5, m15, h1] = await Promise.all([
                    getChange(t.symbol, '5m'),
                    getChange(t.symbol, '15m'),
                    getChange(t.symbol, '1h')
                ]);

                const coinUpdate = {
                    symbol: t.symbol.replace('USDT', ''),
                    price: parseFloat(t.lastPrice),
                    '5m': parseFloat(m5),
                    '15m': parseFloat(m15),
                    '1h': parseFloat(h1),
                    '24h': parseFloat(t.priceChangePercent)
                };

                const idx = pairsData.findIndex(p => p.symbol === coinUpdate.symbol);
                if (idx > -1) pairsData[idx] = coinUpdate; else pairsData.push(coinUpdate);

                scanIdx++;
                localStorage.setItem('pro_screener_data', JSON.stringify(pairsData));
                localStorage.setItem('pro_screener_idx', scanIdx);
                
                renderTable();
                await new Promise(r => setTimeout(r, 60)); // Rate limit protection
            }
        } catch (e) { setTimeout(startScanner, 5000); }
    }

    function setRank(key, el) {
        rankBy = key;
        localStorage.setItem('pro_screener_rank', key);
        updateTabUI();
        renderTable();
    }

    function updateTabUI() {
        document.querySelectorAll('.tab').forEach(t => {
            t.classList.remove('active');
            if (t.innerText.toLowerCase() === rankBy.toLowerCase()) t.classList.add('active');
        });
    }

    function renderTable() {
        const tbody = document.getElementById('table-body');
        const sorted = [...pairsData].sort((a, b) => b[rankBy] - a[rankBy]).slice(0, 20);

        tbody.innerHTML = '';
        sorted.forEach((c, i) => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${i + 1}</td>
                <td><span class="symbol-name">${c.symbol}</span></td>
                <td><span class="price-badge">$${c.price < 1 ? c.price.toFixed(5) : c.price.toLocaleString()}</span></td>
                <td class="${c['5m'] >= 0 ? 'green' : 'red'} ${rankBy==='5m'?'active-rank-col':''}">${c['5m'] > 0 ? '+' : ''}${c['5m']}%</td>
                <td class="${c['15m'] >= 0 ? 'green' : 'red'} ${rankBy==='15m'?'active-rank-col':''}">${c['15m'] > 0 ? '+' : ''}${c['15m']}%</td>
                <td class="${c['1h'] >= 0 ? 'green' : 'red'} ${rankBy==='1h'?'active-rank-col':''}">${c['1h'] > 0 ? '+' : ''}${c['1h']}%</td>
                <td class="${c['24h'] >= 0 ? 'green' : 'red'} ${rankBy==='24h'?'active-rank-col':''}">${c['24h'] > 0 ? '+' : ''}${c['24h'].toFixed(2)}%</td>
            `;
            tbody.appendChild(row);
        });
    }

    startScanner();
</script>
</body>
</html>
