<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Live Screener - Squeeze Pro Elite</title>
    <style>
        :root {
            --bg: #0b0e11; --card: #181a20; --border: #2b3139;
            --text: #eaecef; --dim: #848e9c; --green: #0ecb81;
            --red: #f6465d; --accent: #fcd535; --orange: #f0b90b;
            --pink: #ff78f8; --blue: #3d7eff;
            --table-font: 16px; 
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 10px; overflow-x: hidden; }
        
        .header-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
        .search-box { flex: 1; min-width: 150px; }
        .search-box input { width: 100%; background: var(--card); border: 1px solid var(--border); padding: 8px 12px; border-radius: 4px; color: #fff; outline: none; }
        .size-control { display: flex; align-items: center; gap: 8px; background: var(--card); padding: 5px 12px; border-radius: 4px; border: 1px solid var(--border); font-size: 11px; }
        .status-bar { flex: 2; min-width: 250px; background: #1e2026; padding: 8px 15px; border-radius: 8px; border: 1px solid var(--border); }
        #scan-status { font-size: 10px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab { padding: 6px 18px; font-size: 11px; cursor: pointer; border-radius: 4px; color: var(--dim); background: var(--card); border: 1px solid var(--border); font-weight: bold; }
        .tab.active { color: #000; background: var(--accent); border-color: var(--accent); box-shadow: 0 0 15px rgba(252, 213, 53, 0.3); }
        
        .main-grid { display: flex; gap: 10px; width: 100%; }
        .table-container { flex: 1; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .table-container.watchlist-panel { flex: 0 0 520px; min-width: 400px; }
        .table-title { padding: 8px 12px; font-weight: 900; font-size: 13px; background: #1e2026; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .table-title .wl-count { font-size: 10px; color: var(--dim); font-weight: 600; }
        .scroll-area { max-height: 82vh; overflow-y: auto; width: 100%; flex: 1; }
        
        table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: var(--table-font); }
        th { position: sticky; top: 0; background: #1e2026; color: var(--dim); font-size: 10px; padding: 8px 2px; text-align: right; z-index: 10; border-bottom: 1px solid var(--border); transition: background 0.2s, color 0.2s; }
        td { padding: 6px 4px; text-align: right; border-bottom: 1px solid rgba(255,255,255,0.03); font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
        
        th.active-header { color: var(--accent); background: #2c2f36; border-bottom: 2px solid var(--accent); }
        td.active-col { background: rgba(252, 213, 53, 0.08) !important; font-weight: bold; color: #fff; }
        
        .badge { 
            font-size: 7.5px; padding: 1px 3px; border-radius: 2px; margin-left: 3px; font-weight: 900; 
            vertical-align: middle; text-transform: uppercase; display: inline-block;
        }
        .top-badge { background: var(--accent); color: #000; }
        .bo-badge { background: var(--green); color: #000; box-shadow: 0 0 5px rgba(14, 203, 129, 0.3); }
        .d1-badge { background: var(--pink); color: #000; }
        .sq-badge { background: var(--blue); color: #fff; box-shadow: 0 0 5px rgba(61, 126, 255, 0.5); }

        .golden-zone { background: linear-gradient(90deg, rgba(252, 213, 53, 0.12) 0%, transparent 100%) !important; }

        .col-rank { width: 25px; text-align: left; padding-left: 5px; }
        .col-sym { width: 155px; text-align: left; position: sticky; left: 0; background: var(--card); z-index: 5; border-right: 1px solid var(--border); color: #fff; font-weight: bold; cursor: pointer; transition: background 0.15s; }
        .col-sym:hover { background: #252830; }
        .col-price { width: 85px; }
        .col-pct { width: 60px; }
        .col-vol { width: 70px; color: var(--orange); }
        .col-action { width: 30px; }
        
        .watchlist-panel .col-sym { cursor: default; }
        .watchlist-panel .col-sym:hover { background: var(--card); }

        .btn-remove {
            background: none; border: 1px solid var(--border); color: var(--dim); cursor: pointer;
            border-radius: 3px; font-size: 14px; line-height: 1; padding: 2px 5px; transition: all 0.15s;
        }
        .btn-remove:hover { background: var(--red); color: #fff; border-color: var(--red); }
        
        .btn-add {
            background: none; border: 1px solid var(--border); color: var(--dim); cursor: pointer;
            border-radius: 3px; font-size: 11px; line-height: 1; padding: 2px 5px; transition: all 0.15s;
        }
        .btn-add:hover { background: var(--accent); color: #000; border-color: var(--accent); }

        .wl-empty { text-align: center; padding: 40px 10px; color: var(--dim); font-size: 12px; }
        .wl-empty span { font-size: 20px; display: block; margin-bottom: 8px; opacity: 0.4; }
        
        .green { color: var(--green); }
        .red { color: var(--red); }

        @media (max-width: 1100px) { 
            .main-grid { flex-direction: column; }
            .table-container.watchlist-panel { flex: none; min-width: 0; }
        }
    </style>
</head>
<body>

<div class="header-row">
    <div class="search-box"><input type="text" id="cryptoSearch" placeholder="Search Assets..." oninput="render()"></div>
    <div class="size-control">
        <span>A-</span><input type="range" min="8" max="18" value="16" id="sizeSlider" oninput="updateSize(this.value)"><span>A+</span>
    </div>
    <div class="status-bar">
        <div id="scan-status">Syncing Neural Data...</div>
    </div>
</div>

<div class="tabs">
    <div class="tab" id="tab-5m" onclick="setRank('5m')">5M</div>
    <div class="tab" id="tab-15m" onclick="setRank('15m')">15M</div>
    <div class="tab" id="tab-1h" onclick="setRank('1h')">1H</div>
    <div class="tab active" id="tab-24h" onclick="setRank('24h')">24H</div>
</div>

<div class="main-grid">
    <div class="table-container">
        <div class="table-title" style="color: var(--green);">LIVE SCREENER <span style="font-size:9px;color:var(--dim);font-weight:500;margin-left:8px;">Click symbol to watch</span></div>
        <div class="scroll-area">
            <table>
                <thead>
                    <tr>
                        <th class="col-rank">#</th><th class="col-sym">Symbol</th><th class="col-price">Price</th>
                        <th class="col-pct h-5m" data-tf="5m">5M%</th><th class="col-pct h-15m" data-tf="15m">15M%</th><th class="col-pct h-1h" data-tf="1h">1H%</th><th class="col-pct h-24h" data-tf="24h">24H%</th>
                        <th class="col-vol">TF Vol</th><th class="col-vol">24H Vol</th><th class="col-action"></th>
                    </tr>
                </thead>
                <tbody id="gainers-body"></tbody>
            </table>
        </div>
    </div>
    <div class="table-container watchlist-panel">
        <div class="table-title" style="color: var(--accent);">
            <span>&#9733; WATCHLIST</span>
            <span class="wl-count" id="wl-count">0 assets</span>
        </div>
        <div class="scroll-area">
            <table>
                <thead>
                    <tr>
                        <th class="col-rank">#</th><th class="col-sym">Symbol</th><th class="col-price">Price</th>
                        <th class="col-pct h-5m" data-tf="5m">5M%</th><th class="col-pct h-15m" data-tf="15m">15M%</th><th class="col-pct h-1h" data-tf="1h">1H%</th><th class="col-pct h-24h" data-tf="24h">24H%</th>
                        <th class="col-vol">TF Vol</th><th class="col-vol">24H Vol</th><th class="col-action"></th>
                    </tr>
                </thead>
                <tbody id="watchlist-body"></tbody>
            </table>
            <div class="wl-empty" id="wl-empty">
                <span>+</span>
                Click any symbol on the left to start tracking
            </div>
        </div>
    </div>
</div>

<script>
    const API = "https://fapi.binance.com/fapi/v1";
    let pairs = {};
    let rankBy = '24h'; 
    let isSyncing = false;
    let watchlist = new Set();

    try {
        const saved = JSON.parse(localStorage.getItem('sq_watchlist') || '[]');
        saved.forEach(s => watchlist.add(s));
    } catch(e) {}

    function saveWatchlist() {
        localStorage.setItem('sq_watchlist', JSON.stringify([...watchlist]));
    }

    function toggleWatch(sym) {
        if (watchlist.has(sym)) {
            watchlist.delete(sym);
        } else {
            watchlist.add(sym);
        }
        saveWatchlist();
        render();
    }

    function updateSize(v) { document.documentElement.style.setProperty('--table-font', v + 'px'); }
    const delay = ms => new Promise(res => setTimeout(res, ms));

    function highlightHeaders() {
        document.querySelectorAll('th[data-tf]').forEach(th => {
            th.classList.toggle('active-header', th.dataset.tf === rankBy);
        });
    }

    async function fetchAllData() {
        try {
            const tickerRes = await fetch(`${API}/ticker/24hr`);
            const allTickers = (await tickerRes.json()).filter(t => t.symbol.endsWith('USDT'));
            allTickers.forEach(t => {
                const sym = t.symbol;
                if (!pairs[sym]) {
                    pairs[sym] = {
                        symbol: sym.replace('USDT', ''), price: parseFloat(t.lastPrice),
                        vol24h: parseFloat(t.quoteVolume), '24h': parseFloat(t.priceChangePercent),
                        o5m: null, o15m: null, o1h: null,
                        sqz: { '5m': false, '15m': false, '1h': false, '1d': false, 'd50': false },
                        v5m: 0, v15m: 0, v1h: 0, '5m': 0, '15m': 0, '1h': 0
                    };
                } else {
                    pairs[sym].price = parseFloat(t.lastPrice);
                    pairs[sym].vol24h = parseFloat(t.quoteVolume);
                    pairs[sym]['24h'] = parseFloat(t.priceChangePercent);
                }
                calculatePcts(sym);
            });
            if (!isSyncing) syncMissingOpens(Object.keys(pairs));
            render();
        } catch (e) { document.getElementById('scan-status').innerText = "API Rate Limit..."; }
    }

    /* ── Concurrency limiter: caps live in-flight requests ── */
    class Limiter {
        constructor(max) { this.max = max; this.running = 0; this.queue = []; }
        async run(fn) {
            if (this.running >= this.max) await new Promise(r => this.queue.push(r));
            this.running++;
            try { return await fn(); }
            finally { this.running--; if (this.queue.length) this.queue.shift()(); }
        }
    }
    const netLimiter = new Limiter(25);

    async function syncMissingOpens(symbols) {
        if (isSyncing) return;
        isSyncing = true;

        let done = 0;
        const total = symbols.length;
        const renderEvery = 20;
        let lastRender = 0;

        const workers = 6;
        for (let w = 0; w < workers; w++) {
            (async () => {
                for (let i = w; i < total; i += workers) {
                    const sym = symbols[i];
                    try {
                        const [k5, k15, k1, k1d] = await Promise.all([
                            netLimiter.run(() => fetch(`${API}/klines?symbol=${sym}&interval=5m&limit=25`).then(r => r.json())),
                            netLimiter.run(() => fetch(`${API}/klines?symbol=${sym}&interval=15m&limit=25`).then(r => r.json())),
                            netLimiter.run(() => fetch(`${API}/klines?symbol=${sym}&interval=1h&limit=25`).then(r => r.json())),
                            netLimiter.run(() => fetch(`${API}/klines?symbol=${sym}&interval=1d&limit=70`).then(r => r.json()))
                        ]);

                        const checkSqueeze = (data, period, flatCount) => {
                            if (!data || data.length < (period + flatCount)) return false;
                            for (let j = 0; j < 5; j++) {
                                const segment = data.slice(data.length - (period + j), data.length - j);
                                if (segment.length < period) break;
                                const histHighs = [];
                                for (let f = 1; f <= flatCount; f++) {
                                    const fSeg = data.slice(data.length - (period + j + f), data.length - j - f);
                                    histHighs.push(Math.max(...fSeg.map(c => parseFloat(c[2]))));
                                }
                                const isFlat = histHighs.every(h => h === histHighs[0]);
                                if (isFlat && pairs[sym].price > histHighs[0]) return true;
                            }
                            return false;
                        };

                        if (k5?.length) {
                            pairs[sym].o5m = parseFloat(k5[k5.length - 1][1]);
                            pairs[sym].v5m = parseFloat(k5[k5.length - 1][7]);
                            pairs[sym].sqz['5m'] = checkSqueeze(k5, 10, 5);
                        }
                        if (k15?.length) {
                            pairs[sym].o15m = parseFloat(k15[k15.length - 1][1]);
                            pairs[sym].v15m = parseFloat(k15[k15.length - 1][7]);
                            pairs[sym].sqz['15m'] = checkSqueeze(k15, 10, 5);
                        }
                        if (k1?.length) {
                            pairs[sym].o1h = parseFloat(k1[k1.length - 1][1]);
                            pairs[sym].v1h = parseFloat(k1[k1.length - 1][7]);
                            pairs[sym].sqz['1h'] = checkSqueeze(k1, 10, 5);
                        }
                        if (k1d?.length) {
                            pairs[sym].sqz['1d'] = checkSqueeze(k1d, 10, 5);
                            pairs[sym].sqz['d50'] = checkSqueeze(k1d, 50, 10);
                        }

                        calculatePcts(sym);
                    } catch (err) { }

                    done++;
                    if (done - lastRender >= renderEvery) {
                        lastRender = done;
                        document.getElementById('scan-status').innerText = `SQUEEZE MAP: ${Math.round((done / total) * 100)}%`;
                        render();
                    }
                }
            })();
        }

        await new Promise(resolve => {
            const check = setInterval(() => {
                if (done >= total) { clearInterval(check); resolve(); }
            }, 200);
        });

        document.getElementById('scan-status').innerText = "LIVE: SQUEEZE ENGINE READY";
        isSyncing = false;
        render();
    }

    function calculatePcts(sym) {
        const p = pairs[sym];
        if (p.o5m) p['5m'] = ((p.price - p.o5m) / p.o5m * 100);
        if (p.o15m) p['15m'] = ((p.price - p.o15m) / p.o15m * 100);
        if (p.o1h) p['1h'] = ((p.price - p.o1h) / p.o1h * 100);
    }

    function setRank(key) {
        rankBy = key;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${key}`).classList.add('active');
        highlightHeaders();
        render();
    }

    function formatVol(v) {
        if (!v) return '0';
        if (v >= 1e9) return (v / 1e9).toFixed(1) + 'B';
        if (v >= 1e6) return (v / 1e6).toFixed(1) + 'M';
        return Math.round(v).toLocaleString();
    }

    function buildBadges(p, leaders, tfs) {
        let badges = ''; let isGolden = false;
        tfs.forEach(tf => { if (leaders[tf] === p.symbol) { badges += `<span class="badge top-badge">${tf}</span>`; isGolden = true; } });
        if (p.sqz['5m']) badges += `<span class="badge bo-badge">5M</span>`;
        if (p.sqz['15m']) badges += `<span class="badge bo-badge">15M</span>`;
        if (p.sqz['1h']) badges += `<span class="badge bo-badge">1H</span>`;
        if (p.sqz['1d']) badges += `<span class="badge d1-badge">1D</span>`;
        if (p.sqz['d50']) badges += `<span class="badge sq-badge">SQZ 50</span>`;
        return { badges, isGolden };
    }

    function render() {
        highlightHeaders();

        const query = document.getElementById('cryptoSearch').value.toUpperCase();
        let fullList = Object.values(pairs);
        const tfs = ['5m', '15m', '1h', '24h'];
        const leaders = {};
        tfs.forEach(tf => {
            const top = fullList.reduce((prev, curr) => ((curr[tf] || -999) > (prev[tf] || -999) ? curr : prev), { [tf]: -999 });
            if (top.symbol) leaders[tf] = top.symbol;
        });

        let list = query ? fullList.filter(p => p.symbol.includes(query)) : fullList;
        const sorted = list.sort((a, b) => (b[rankBy] || -999) - (a[rankBy] || -999));
        const top60 = sorted.slice(0, 60);

        const mainRows = top60.map((p, i) => {
            const tfVol = rankBy === '5m' ? p.v5m : rankBy === '15m' ? p.v15m : rankBy === '1h' ? p.v1h : p.vol24h;
            const { badges, isGolden } = buildBadges(p, leaders, tfs);
            const isWatched = watchlist.has(p.symbol);
            return `
            <tr class="${isGolden ? 'golden-zone' : ''}">
                <td class="col-rank">${i + 1}</td>
                <td class="col-sym" onclick="toggleWatch('${p.symbol}')">${p.symbol}${badges}</td>
                <td class="col-price">$${p.price < 1 ? p.price.toFixed(5) : p.price.toLocaleString()}</td>
                <td class="col-pct ${p['5m'] >= 0 ? 'green' : 'red'} ${rankBy === '5m' ? 'active-col' : ''}">${(p['5m'] || 0).toFixed(2)}%</td>
                <td class="col-pct ${p['15m'] >= 0 ? 'green' : 'red'} ${rankBy === '15m' ? 'active-col' : ''}">${(p['15m'] || 0).toFixed(2)}%</td>
                <td class="col-pct ${p['1h'] >= 0 ? 'green' : 'red'} ${rankBy === '1h' ? 'active-col' : ''}">${(p['1h'] || 0).toFixed(2)}%</td>
                <td class="col-pct ${p['24h'] >= 0 ? 'green' : 'red'} ${rankBy === '24h' ? 'active-col' : ''}">${(p['24h'] || 0).toFixed(2)}%</td>
                <td class="col-vol">${formatVol(tfVol)}</td>
                <td class="col-vol">${formatVol(p.vol24h)}</td>
                <td class="col-action"><button class="btn-add" onclick="event.stopPropagation();toggleWatch('${p.symbol}')" style="${isWatched ? 'color:var(--accent);border-color:var(--accent);' : ''}">${isWatched ? '&#9733;' : '+'}</button></td>
            </tr>`;
        });
        document.getElementById('gainers-body').innerHTML = mainRows.join('');

        const wlSymbols = [...watchlist];
        const wlData = wlSymbols.map(sym => pairs[sym + 'USDT']).filter(Boolean);
        wlData.sort((a, b) => (b[rankBy] || -999) - (a[rankBy] || -999));

        document.getElementById('wl-count').innerText = wlData.length + ' asset' + (wlData.length !== 1 ? 's' : '');
        document.getElementById('wl-empty').style.display = wlData.length === 0 ? 'block' : 'none';

        const wlRows = wlData.map((p, i) => {
            const tfVol = rankBy === '5m' ? p.v5m : rankBy === '15m' ? p.v15m : rankBy === '1h' ? p.v1h : p.vol24h;
            const { badges, isGolden } = buildBadges(p, leaders, tfs);
            return `
            <tr class="${isGolden ? 'golden-zone' : ''}">
                <td class="col-rank">${i + 1}</td>
                <td class="col-sym">${p.symbol}${badges}</td>
                <td class="col-price">$${p.price < 1 ? p.price.toFixed(5) : p.price.toLocaleString()}</td>
                <td class="col-pct ${p['5m'] >= 0 ? 'green' : 'red'} ${rankBy === '5m' ? 'active-col' : ''}">${(p['5m'] || 0).toFixed(2)}%</td>
                <td class="col-pct ${p['15m'] >= 0 ? 'green' : 'red'} ${rankBy === '15m' ? 'active-col' : ''}">${(p['15m'] || 0).toFixed(2)}%</td>
                <td class="col-pct ${p['1h'] >= 0 ? 'green' : 'red'} ${rankBy === '1h' ? 'active-col' : ''}">${(p['1h'] || 0).toFixed(2)}%</td>
                <td class="col-pct ${p['24h'] >= 0 ? 'green' : 'red'} ${rankBy === '24h' ? 'active-col' : ''}">${(p['24h'] || 0).toFixed(2)}%</td>
                <td class="col-vol">${formatVol(tfVol)}</td>
                <td class="col-vol">${formatVol(p.vol24h)}</td>
                <td class="col-action"><button class="btn-remove" onclick="toggleWatch('${p.symbol}')">&#10005;</button></td>
            </tr>`;
        });
        document.getElementById('watchlist-body').innerHTML = wlRows.join('');
    }

    updateSize(16);
    fetchAllData();
    setInterval(fetchAllData, 5000);
    setInterval(() => { if (!isSyncing) syncMissingOpens(Object.keys(pairs)); }, 60000);
</script>
</body>
</html>
